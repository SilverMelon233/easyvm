name: freebsd 15.1 - sshd, XFCE, and a desktop
resolution:
- 1920
- 1080
ssh_user: vmuser
ssh_port: 2222
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/freebsd-ssh.qcow2
  shutdown:
    from: args.shutdown
    default: ssh
steps:
- name: start recording
  record: freebsd-ssh.mp4
- name: boot the disk
  boot: true
  os: bsd
  memory_mb: 8192
  timeout: 900

# SSHD, THE ACCOUNT AND `PasswordAuthentication` ARE ALL SET BY THE INSTALL STAGE, IN ITS CHROOT
# SHELL. This stage used to type into the console to unlock password authentication, and that route
# was measured and failed: `su: Sorry` before the account was in `wheel`, and
# `/etc/ssh/sshd_config: Permission denied` after, because a console login as the unprivileged user
# cannot edit a root-owned file.
#
# SO THIS STAGE STARTS BY EXPECTING THE RESULT. `require_ssh` below is the proof, and a failure there
# means the install stage's chroot block regressed rather than that this stage forgot something.
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
- name: prove the account over ssh
  ssh: id -un

# ==========================================================================================
# XFCE, FROM FREEBDS'S OWN REPOSITORY
# ==========================================================================================
#
# NO REPOSITORY FILE IS WRITTEN AND NONE IS NEEDED. The base system ships
# `/etc/pkg/FreeBSD.conf`, which points at `pkg+https://pkg.FreeBSD.org/${ABI}/quarterly`, and a
# run that touches nothing uses it. An override under `/usr/local/etc/pkg/repos/` would shadow that
# file with a copy of itself - a second place the answer is written down, and one that goes stale the
# day FreeBSD changes its own default.
#
# A MIRROR WAS TRIED AND REMOVED. The route out of this lab to pkg.freebsd.org is slow (measured:
# 38-68 KB/s direct from the pod, and the guest's own rate is the same, so nothing about the guest is
# wrong), and a public mirror answers the same file in under a second. But a bake that points at a
# mirror is a bake that measures a different machine than CI runs, and the whole reason these files
# are byte-identical to CI's is that a local success has to mean something. The slow route is a fact
# about the lab, not about FreeBSD.
- name: install xfce and the display manager
  # `sudo` IS THE ESCALATION, AND IT IS THE SAME ONE THE OTHER THREE SYSTEMS USE.
  #
  # MEASURED, at this step, on run 43628836904:
  #
  #	pkg: Insufficient privileges to install packages
  #
  # `pkg` needs root, and this account is not root. `su` cannot substitute for `sudo` here, and that
  # is measured rather than assumed: FreeBSD's `su` reads the password from `/dev/tty`, not stdin, and
  # an `ssh:` command has no terminal - `printf pw | su -c ...` answers `BAD SU` even with the right
  # password. `script -q /dev/null` was tried to provide a pty and failed the same way.
  #
  # SO `sudo` IS INSTALLED BY THE INSTALL STAGE, in the one place a root shell exists (its chroot),
  # with a NOPASSWD sudoers file for this account. That is what `bsd/freebsd/steps/install.yaml`'s
  # `install sudo` step does, and it is why this line can be a plain `sudo` with no password on stdin.
  ssh: sudo env ASSUME_ALWAYS_YES=yes pkg install -y xfce lightdm lightdm-gtk-greeter
  timeout: 5400

- name: prove xfce is installed
  # THE ARTIFACT, NOT A PHRASE FROM THE INSTALLER'S OUTPUT: the session file is what lightdm reads to
  # offer `Xfce Session`, so its presence is the thing this stage needs.
  #
  # `ls` RATHER THAN `test -f`: `test` succeeds silently, and a step whose log line is an exit status
  # says nothing about WHAT is on the disk. `ls` prints the file and its size, so the log carries the
  # evidence rather than only the verdict. A missing file makes `ls` exit non-zero, which is the same
  # failure with more to read.
  ssh: ls -l /usr/local/share/xsessions/xfce.desktop
  timeout: 120

- name: enable the display manager at boot
  # `sudo` BECAUSE sysrc WRITES /etc/rc.conf, WHICH IS ROOT-OWNED. MEASURED on run 43635376123:
  #
  #	/usr/sbin/sysrc: cannot create /etc/rc.conf: Permission denied
  #
  # The xfce install above needed sudo for the same reason, and so does every write below this line.
  ssh: sudo sysrc lightdm_enable=YES
  timeout: 120

- name: point lightdm at the greeter and autologin
  # THE GREETER IS NAMED EXPLICITLY, because lightdm's default is `lightdm-gtk-greeter` on some builds
  # and a missing one on others - and a missing greeter is a black screen.
  #
  # `autologin-user` IS SET HERE RATHER THAN IN THE INSTALLER: the installed system has one account and
  # a walkthrough that has to type a password at a greeter cannot be driven by anything unattended.
  # `autologin-user-timeout=0` IS NOT A DELAY OF ZERO - it means "do not show the greeter at all", and
  # without it lightdm still draws the prompt for its default ten seconds.
  #
  # `echo` RATHER THAN A MULTI-LINE `printf` WITH A TRAILING `\`: those are the lines csh rejected with
  # `Unmatched '''`, because a single-quoted string may not span lines and every continuation put one
  # there. Nothing here needs a continuation.
  #
  # EVERY WRITE IS `sudo`: /usr/local/etc/lightdm is root-owned, and the same Permission denied that
  # `sysrc` hit would land on the first redirect.
  ssh: |
    sudo mkdir -p /usr/local/etc/lightdm
    echo '[Seat:*]' | sudo tee /usr/local/etc/lightdm/lightdm.conf > /dev/null
    echo 'greeter-session=lightdm-gtk-greeter' | sudo tee -a /usr/local/etc/lightdm/lightdm.conf > /dev/null
    echo 'autologin-user={{ user }}' | sudo tee -a /usr/local/etc/lightdm/lightdm.conf > /dev/null
    echo 'autologin-user-timeout=0' | sudo tee -a /usr/local/etc/lightdm/lightdm.conf > /dev/null
    echo 'user-session=xfce' | sudo tee -a /usr/local/etc/lightdm/lightdm.conf > /dev/null
    cat /usr/local/etc/lightdm/lightdm.conf
  timeout: 120

- name: prove lightdm will start
  ssh: grep -c autologin-user /usr/local/etc/lightdm/lightdm.conf
  timeout: 120

- name: stop the machine
  # A STAGE WHOSE OUTPUT IS THE DISK MAY NOT BE KILLED: xfce's install writes thousands of files and a
  # kill leaves a pool that needs a replay. `ssh` asks the guest's own init to power off.
  shutdown: '{{ shutdown }}'
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
