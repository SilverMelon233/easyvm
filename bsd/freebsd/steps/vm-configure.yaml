name: freebsd 15.1 - the desktop is up
resolution:
- 1920
- 1080
ssh_user: vmuser
ssh_port: 2222
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/freebsd-vm-configure.qcow2
  # `acpi` AND NOT `ssh`, FOR THE REASON THE SSH STAGE ALREADY LEARNED THE HARD WAY.
  #
  # MEASURED on run 43775237750, this stage:
  #
  #	stopping with method "ssh"
  #	asking the guest to shut down over ssh
  #	the guest did not power off within 5m0s; killing it - the disk will need a journal replay
  #
  # and the same on two earlier disks, where the next boot said
  #
  #	/dev/vtbd0p2: UNEXPECTED SOFT UPDATE INCONSISTENCY; RUN fsck MANUALLY.
  #
  # `poweroff` over ssh asks init to stop, and on this guest init reaches power-off before UFS's clean
  # flag is written - that flag belongs to the unmount, not to `sync`. The ACPI power button is the
  # orderly shutdown the installer itself produces.
  shutdown:
    from: args.shutdown
    default: acpi
steps:
- name: start recording
  record: freebsd-vm-configure.mp4
- name: boot the disk
  boot: true
  os: bsd
  memory_mb: 8192
  timeout: 900
- name: wait for sshd
  require_ssh: true
  timeout: 600

# THE DESKTOP IS THE VERDICT ON THE WHOLE CHAIN, AND IT IS A PICTURE RATHER THAN A PHRASE.
#
# `desktop: bsd` WOULD BE THE OBVIOUS TEST AND IT DOES NOT EXIST: `internal/screen` has
# `IsWindowsDesktop`, `IsLinuxDesktop` and `IsMacOSDesktop`, and a BSD desktop with XFCE draws the same
# panel a Linux XFCE does - so `IsLinuxDesktop` is the right measurement, and the boot menu behind it
# is what makes the distinction meaningless at this point (xfce's own panel is the thing being looked
# for, not the kernel).
- name: the session is running
  # `startx` IS NOT USED: lightdm starts the session at boot because `lightdm_enable=YES` and
  # `autologin-user` were set by the ssh stage. What this asks is whether lightdm actually got there.
  # `sh -c` BECAUSE THE LOGIN SHELL IS `csh`, WHICH HAS NO `&&` AND NO `>/dev/null` IN THAT POSITION.
  ssh: sh -c 'pgrep -x lightdm >/dev/null && echo LIGHTDM_UP'
  timeout: 180

- name: wait for the desktop
  loop:
    max: 40
    do:
    - wait: 10
    ocr:
      name: desk
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: ready
      from: desk
      # AN XFCE SESSION DRAWS `Applications` IN ITS PANEL AND SITS ON A DESKTOP WHOSE CONTEXT MENU SAYS
      # `Desktop`. Both are absent from the boot log, from a login prompt and from a black screen -
      # which is what the three failure modes look like.
      mode: says_any
      words:
      - - applications
      - - desktop
      - - xfce
    until:
      fact: ready

- name: the desktop is not a login prompt
  # A GREETER ALSO DRAWS TEXT, so "something is on screen" is not enough: `/etc/issue` and the greeter's
  # own `Password:` line are what a session that never started looks like, and this fails the stage on
  # them rather than publishing a disk that boots to a prompt.
  ocr:
    name: greeter
    region:
    - 0
    - 0
    - 1920
    - 1080
    region_at:
    - 1920
    - 1080
    scale: 1
    wait: 0
- name: check there is no login prompt
  # `words:` IS WHAT MUST BE THERE AND `without:` IS WHAT MUST NOT, so this asks for both halves of
  # the verdict at once: the panel that only a session draws, and the absence of the greeter's own
  # words. MEASURED on run 43779389910, where the reading was
  #
  #	% Applications = 20 ee L° User Vmuser Home File System Trash ...
  #
  # and this step returned false because it had been written the other way round - it demanded the
  # word `freebsd`, which is the CONSOLE's banner and is not on the desktop at all. A check that is
  # false on a correct screen is worse than no check: it teaches the next reader to ignore the line.
  check:
    name: no_prompt
    from: greeter
    mode: says_without
    words:
    - applications
    without:
    - login
    - password

- name: flush the writes before anything else
  # `sync` BEFORE THE SHUTDOWN, AND IT IS NOT REDUNDANT WITH IT.
  #
  # MEASURED on run 43637282104, whose ssh leg SUCCEEDED and still printed:
  #
  #	the guest did not power off within 5m0s; killing it - the disk will need a journal replay
  #
  # A guest that is killed while a pool is open leaves its writes to be replayed, and a disk that
  # needs a replay is a disk whose next boot may or may not find what this stage wrote. `sync` asks
  # the kernel to hand every dirty block over NOW, so what the stage produced is on the medium before
  # anything decides how the machine ends.
  #
  # `sudo` BECAUSE THE ACCOUNT IS UNPRIVILEGED. It is in the NOPASSWD sudoers file the install stage
  # wrote, so this is one command with no prompt.
  ssh: sudo sync
  timeout: 300

- name: stop the machine
  # TEN MINUTES RATHER THAN FIVE, because this guest has just written xfce and a display manager and
  # its shutdown path touches every one of those files. The five-minute default ran out on a machine
  # that was shutting down correctly, only slowly.
  shutdown: '{{ shutdown }}'
  timeout: 600
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
