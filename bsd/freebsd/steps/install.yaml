name: freebsd 15.1 - bsdinstall, to an installed system
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
  shutdown:
    from: args.shutdown
    # `kill` IS WHAT `TestAnInstallStopsTheMachineBeforePublishingTheDisk` REQUIRES OF EVERY INSTALL
    # LEG, and the reason is the installer rather than this stage: a LIVE installer's init ignores
    # ACPI, so `acpi` waits out its timeout for a power-off nobody performs and the disk is still
    # being released when `qemu-img convert` reads it.
    #
    # THAT ARGUMENT SAYS NOTHING ABOUT DURABILITY, AND DURABILITY IS THE BUG THIS FILE HAD. MEASURED,
    # on the disk CI published for run 43631122683 - install leg: 48 of 48 steps, success:
    #
    #	file /usr/local/bin/sudo          setuid data
    #	od -An -tx1 -N16 /usr/local/bin/sudo
    #	                                  00 00 00 00 ...   ALL ZEROS, 228312 of them
    #	od -An -tx1 -N16 /bin/sh          7f 45 4c 46 ...   ELF, correct
    #	pkg install -f pkg                Segmentation fault
    #
    # `pkg` wrote the packages into page cache and the machine was killed before any of it reached the
    # medium. The base system survived because it was written minutes earlier and had been synced.
    #
    # SO THE FLUSH IS ITS OWN STEP, just above, and this line stays `kill`. `sync` returns only when
    # the kernel has handed the dirty blocks over, which makes the shutdown method irrelevant to
    # whether the disk is complete.
    default: kill
steps:
- name: start recording
  record: freebsd-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  release: freebsd
  asset: linux_iso
- name: boot the installer
  boot: true
  os: bsd
  # THE MEDIUM HAS TO BE NAMED, AND ITS ABSENCE IS SILENT. `fetch:` puts the file in the work directory
  # and the asset layer keeps its path under this role, but `boot:` mounts only what its `iso:` names.
  # MEASURED on the first attempt at this file, whose qemu command line had the target disk and NO
  # optical device:
  #
  #	BdsDxe: No bootable option or device was found.
  #
  # `bsd/ghostbsd/steps/gbi.yaml` has this line and that is why the GhostBSD installer ever started.
  iso: installer_iso
  # EIGHT GIGABYTES, AND THIS IS A REQUIREMENT OF ZFS RATHER THAN A PREFERENCE.
  #
  # MEASURED: the 4 GiB default got the installer through partitioning and the base-system extraction
  # and then left the machine to swap against itself; ZFS allocates its ARC out of the same memory and
  # the install is the worst case for it - a whole pool being written while the installer's own
  # processes run. `bsd/ghostbsd` states the same number for the same reason ("26.3's 1909 MiB uzip
  # image cannot fit in a 4 GiB memdisk").
  memory_mb: 8192
  timeout: 1800

# `bsdinstall` IS A bsddialog INSTALLER: EVERY PANE IS A TEXT BUTTON ROW, AND THE KEYS ARE THE NAVIGATION.
#
# THAT IS THE OPPOSITE OF THE GUI WALKTHROUGHS IN THIS REPOSITORY, and it changes two things:
#
#	PRESELECTION IS THE DEFAULT ANSWER. Almost every pane opens with the right button highlighted, so
#	`key: ret` alone advances it. A click at a coordinate would be a guess about a font.
#
#	LETTERS ARE SHORTCUTS INSIDE A LIST. In `ZFS Configuration`, `T` opens the pool editor and `P` cycles
#	the partition scheme - so a stray letter is an ACTION, not nothing. MEASURED: an `esc` sent to leave
#	that list aborted the running install and put up
#
#		ZFS setup failed
#		An installation step has been aborted. Would you like to restart the installation, or exit?
#
#	which is why this file presses nothing it has not been measured to need.
#
# THE SEQUENCE BELOW IS THE ONE THAT WAS WALKED BY HAND ON THIS GUEST, pane by pane, and every `name:`
# is the title or the highlighted row that was on screen at that moment.
- name: wait for the installer menu
  loop:
    max: 60
    do:
    - wait: 10
    ocr:
      name: pane
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: menu_up
      from: pane
      mode: says_any
      words:
      - - install
      - - live
        - system
    until:
      fact: menu_up

- name: welcome - Install is preselected
  # `Welcome to FreeBSD! Would you like to begin an installation or use the live system?`
  # [ Install ] [ Shell ] [ Live System ]
  key: ret
  wait_after: 10
- name: keymap - continue with the default
  # `Keymap Selection` -> `>> Continue with default keymap`, preselected.
  key: ret
  wait_after: 8
- name: hostname
  # `Please choose a hostname for this machine.` - an INPUT FIELD, so the text has to be cleared.
  # The field is focused on arrival; typing appends to nothing because it starts empty.
  type: freebsd
  wait_after: 2
- name: accept the hostname
  key: ret
  wait_after: 8
# `PACKAGES (TECH PREVIEW)` IS THE OFFLINE PATH, AND THIS FILE HAD IT BACKWARDS.
#
# THE COMMENT HERE USED TO SAY "DISTRIBUTION SETS, NOT PACKAGES: the tech preview path fetches from
# the network and this stage deliberately does not depend on it." THE OPPOSITE IS TRUE, AND THE
# MEDIUM SAYS SO:
#
#	xorriso -indev disc1.iso -find /usr/freebsd-dist
#	  '/usr/freebsd-dist/MANIFEST'          <- a manifest
#	  .txz files: 0                          <- and NOT ONE DISTRIBUTION SET
#	xorriso -indev disc1.iso -find /usr/freebsd-packages/offline
#	  328 packages                           <- base, kernel and the rest of the system
#
# So `Distribution Sets` cannot unpack anything from this disc: `fetchmissingdists` goes to a mirror,
# which is the `Mirror Selection` pane and its `http://download.freebsd.org` list. MEASURED, on a
# local replay: choosing Distribution Sets put that pane on screen within seconds.
#
# `Packages` is pkgbase, and pkgbase unpacks the 328 packages ALREADY ON THE DISC through
# `BSDINSTALL_PKG_REPOS_DIR=/usr/freebsd-packages/repos/`, which is the "Offline (Limited Packages)"
# answer to the question after this one.
#
# THE PARTITIONING MENU IS INDEPENDENT OF THIS CHOICE - ZFS is chosen on its own pane either way - so
# what this actually decides is whether the install touches the network at all.
- name: installation type - packages, which is offline
  # `Would you like to install the base system using legacy distribution sets or packages?`
  #   [ Distribution Sets ]  [ Packages ]
  #
  # `PACKAGES` IS ALREADY HIGHLIGHTED. From usr.sbin/bsdinstall/scripts/auto, when the medium carries
  # /usr/freebsd-packages/repos (disc1 does):
  #
  #	PKGBASE_DEFAULT_BUTTON=--default-no
  #	bsddialog --yes-label "Distribution Sets" --no-label "Packages" --yesno $PKGBASE_DEFAULT_BUTTON
  #
  # and MEASURED by OCR on the pane, it opens as `Packages (Tech Preview) 1]` - the No button - so a
  # bare Return takes it.
  key: ret
  wait_after: 10

- name: offline - the packages are on this disc
  # `Network or Offline Installation`  [ Network ]  [ Offline (Limited Packages) ]
  #
  # `NETWORK` IS THE HIGHLIGHTED BUTTON, NOT OFFLINE, AND THE RETURN THAT TOOK IT COST A RUN.
  #
  # MEASURED: with a bare Return here the install died with
  #
  #	Updating repositories failed, try again?
  #	Installation of base system packages failed
  #
  # because `Network` means "fetch the base system from pkg.FreeBSD.org", and this lab reaches that
  # host at 38-68 KB/s. The medium carries the 328 packages under /usr/freebsd-packages/offline and
  # the installer only uses them when this answer is `Offline`.
  #
  # So this is NOT a pane where the default is right: `right` reaches Offline, then Return.
  do:
  - key: right
    wait_after: 1
  - key: ret
    wait_after: 10

- name: partitioning - automatic ufs
  # THE MENU, AND NOTHING ELSE: THE KEYSTROKE IS SENT BY THE STEP AFTER THIS ONE.
  #
  # THE FIRST VERSION OF THIS PAIR SENT `down` IMMEDIATELY, AND THAT KEY WENT TO THE PANE BEFORE THE
  # MENU. MEASURED on a local replay, whose next step then read
  #
  #	Would you like to use this entire disk (vtbd0) for FreeBSD or partition it to share it ...
  #
  # - the `Entire Disk` dialog, which belongs to the ZFS path and is NOT what
  #   `Auto (UFS)` leads to. So the Return had been eaten by the pane above, the menu opened and
  #   closed unseen, and the walk was already somewhere else.
  #
  # WHAT THIS STAGE ASKS FOR, ON THE USER'S INSTRUCTION: `Auto (UFS)`.
  wait: 12

- name: wait for the partitioning menu before choosing on it
  # THE FIRST KEY OF THIS SECTION WAS SENT BLIND, AND THE OCR READ IT BACK.
  #
  # MEASURED on CI, run 43657195812, whose `wait for the zfs configuration menu` loop reported:
  #
  #	wait for the zfs configuration menu [check]: zfs_showing = false
  #	  (none of "pool" or "partition scheme" in
  #	   "puto C2FS)sGuided Root-on-2F5 uto CUFS) anual hell OK")
  #
  # that string is `Auto (ZFS) / Auto (UFS) / Manual / Shell / OK` - THE PARTITIONING MENU ITSELF,
  # still on screen after the `down` and the `ret`. So the pane had not been drawn when those keys
  # were sent, they went to the pane before it, and the menu then sat waiting with `Auto (UFS)`
  # highlighted. That is the same UFS outcome by a different route.
  #
  # `down` THEN `ret` IS STILL THE RIGHT PAIR - `Auto (UFS)` is the first row and `Auto (ZFS)` is the
  # second - but only once the list exists.
  loop:
    max: 25
    do:
    - wait: 6
    ocr:
      name: partmenu
      region:
      - 740
      - 420
      - 1200
      - 660
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: part_showing
      from: partmenu
      # THE CHECK MUST LOOK FOR WHAT THE OCR ACTUALLY READS, NOT WHAT TESSERACT READS BY HAND.
      #
      # MEASURED, on the same frame, twice:
      #
      #	my hand:  tesseract on a Pillow crop    "How would you like to partition your disk? ..."
      #	the run:  the step's own read            "puto C2FS)siGuided Root-on-2F5 uto CUFS) anual hell OK"
      #
      # The headline is read by one and dropped by the other - `scale: 2` plus `--psm 6` on a wide,
      # mostly-empty dialog does that, and the dialog's first line is the casualty.
      #
      # SO THE WORDS ARE TAKEN FROM THE BODY, WHICH THE RUN DID READ: `Guided` and `Manual` and
      # `Shell` are the three rows of this menu and they survive the scaling. A check that names the
      # question fails on a screen where the question was merely hard to read, and that is a bug in
      # the check rather than a pane that never arrived.
      mode: says
      words:
      - guided
      - manual
    until:
      fact: part_showing

- name: choose auto ufs
  # `UFS`, ON THE USER'S INSTRUCTION, AND IT IS ALSO THE SIMPLER PATH ON THIS MEDIUM.
  #
  # THE LIST ON amd64, from usr.sbin/bsdinstall/scripts/auto: it PREPENDS ZFS for architectures that
  # can boot it, so the order is
  #
  #	>> Auto (ZFS)   Guided Root-on-ZFS       FIRST, and preselected
  #	   Auto (UFS)   Guided UFS Disk Setup    <- one `down`
  #	   Manual       Manual Disk Setup (experts)
  #	   Shell        Open a shell and partition by hand
  #
  # MEASURED BOTH WAYS on this guest, by reading the partition editor afterwards:
  #
  #	down + ret   ->  vtbd0p2  124 GB  freebsd-ufs     UFS, and no ZFS panes follow
  #	ret alone    ->  ZFS Configuration -> Virtual Device type -> disk list -> 'Updating repositories'
  #
  # THE ZFS PATH ALSO ASKS TWO QUESTIONS THIS FILE HAS NO BUSINESS ANSWERING - `Entire Disk or
  # Partition` and `Select a partition scheme` - and then tries to update a pkg repository before it
  # installs anything, which on a medium with an offline repository is a network call that can fail:
  #
  #	Updating repositories failed, try again?
  #	Installation of base system packages failed
  #
  # UFS asks neither of those. It partitions, unpacks, and moves on.
  do:
  - key: down
    wait_after: 1
  - key: ret
    wait_after: 10

- name: entire disk, not a shared partition
  # `Auto (UFS)` ASKS THIS BEFORE IT PARTITIONS, AND THE FILE DID NOT KNOW - SO EVERY KEY AFTER THIS
  # POINT WENT TO THE WRONG PANE.
  #
  # MEASURED on a local replay, immediately after choosing `Auto (UFS)`:
  #
  #	Would you like to use this entire disk (vtbd0) for FreeBSD or partition it to
  #	share it with other operating systems?  Using the entire disk will erase any
  #	data currently stored there.
  #
  #	[ Entire Disk ]  [ Partition ]
  #
  # `Entire Disk` IS ALREADY HIGHLIGHTED and is the right answer for a single empty disk: sharing it
  # would create a slice and leave the rest unusable, which is not what a golden disk wants.
  #
  # THIS IS NOT A ZFS PANE. The earlier note in this file blamed it on the ZFS path; `autopart` asks
  # the same question, and the scripted `Auto` mode does not.
  key: ret
  wait_after: 10

- name: partition scheme - GPT, which is what makes this disk UEFI bootable
  # THE SECOND QUESTION `Auto (UFS)` ASKS, AND THE ONE THAT DECIDES WHETHER THE DISK BOOTS.
  #
  # MEASURED on a local replay, immediately after `Entire Disk`:
  #
  #	Partition Scheme
  #	  Select a partition scheme for this volume:
  #	    APM  Apple Partition Map
  #	    BSD  BSD Labels
  #	 >> GPT  GUID Partition Table          <- ALREADY HIGHLIGHTED
  #	    MBR  DOS Partitions
  #	  [ OK ]  [ Cancel ]
  #	Bootable on most x86 systems and EFI aware ARM64
  #
  # `GPT` IS PRESELECTED and the footer names why: it is the only scheme here that is bootable on
  # EFI, and this guest has UEFI firmware. `MBR` would produce a disk the firmware cannot start.
  #
  # THIS PANE BELONGS TO `autopart` AS MUCH AS TO `zfsboot` - the earlier note in this file called it
  # ZFS-only, and that is why it was missing from the UFS path.
  key: ret
  wait_after: 10

- name: wait for the partition editor
  # UFS GOES STRAIGHT FROM THE MENU TO `Partition Editor`, with the layout already made:
  #
  #	Partition Editor
  #	  vtbd0p1  260 MB  efi           /boot/efi
  #	  vtbd0p2  124 GB  freebsd-ufs   /
  #	  vtbd0p3  4.4 GB  freebsd-swap  none
  #	  [Create] [Delete] [Modify] [Revert] [Auto] [Finish]
  #
  # `Finish` IS THE BUTTON THAT ACCEPTS IT, and it is the last one in the row, so the key is `tab`
  # until it is highlighted rather than a fixed number of rights - the row has six buttons and the
  # focus starts on `Create`.
  loop:
    max: 25
    do:
    - wait: 6
    ocr:
      name: parted
      region:
      - 740
      - 350
      - 1260
      - 720
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: parted_showing
      from: parted
      # THE CHECK MUST SURVIVE THE OCR'S OWN SPELLING, AND `freebsd-ufs` DOES NOT.
      #
      # MEASURED: the run read
      #
      #	Please review the disk setup. ... 264 MB efi /boot/efi 124 GB freebsd-ufs / ...
      #
      # and `says` normalises each word by dropping everything that is not a letter or a digit - so
      # `freebsd-ufs` becomes `freebsdufs` and does NOT equal `freebsd`. The pane was on screen and
      # the check said it was not, which is the third time in this file that a correct screen failed
      # a check written for it.
      #
      # `finish` AND `delete` are whole words on the button row, so no normalisation can split them.
      mode: says
      words:
      - finish
      - delete
    until:
      fact: parted_showing

- name: accept the partitioning
  # SIX `tab` PRESSES, COUNTED ON THE SCREEN RATHER THAN GUESSED.
  #
  # The button row is
  #
  #	[Create] [Delete] [Modify] [Revert] [ Auto ] [Finish]
  #
  # with `Create` holding the focus when the editor opens. MEASURED, by pressing tab and cropping the
  # row after each press:
  #
  #	0  [Create] highlighted
  #	3  [Modify] highlighted
  #	6  [Finish] highlighted      <- and a Return now accepts the layout
  #
  # THE FIRST VERSION OF THIS STEP SAID FIVE, from counting the buttons rather than the presses: six
  # buttons means five MOVES only if the focus starts OUTSIDE the row, and it starts on the first.
  do:
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: ret
    wait_after: 10

- name: commit the layout
  # `Finish` ASKS ONE MORE QUESTION, AND ITS DEFAULT IS ALREADY THE RIGHT ANSWER.
  #
  # MEASURED, immediately after the Return on `Finish`:
  #
  #	Your changes will now be written to disk. If you have chosen to overwrite existing
  #	data, it will be PERMANENTLY ERASED. Are you sure you want to commit your changes?
  #
  #	[ Commit ]  [ Revert & Exit ]  [ Back ]
  #
  # `Commit` IS HIGHLIGHTED, so this is a bare Return. `Revert & Exit` would throw away the layout the
  # previous steps just agreed to.
  key: ret
  wait_after: 15

- name: distribution select - accept the default set
  # THE COMPONENT CHECKLIST, WHICH ONLY THE PKGBASE PATH SHOWS, AND ITS CURSOR IS ALREADY ON `OK`.
  #
  # MEASURED, on the screen the partition steps hand over to:
  #
  #	Distribution Select
  #	  A minimal set of packages suitable for a multi-user system is always installed.
  #	  Select additional packages you wish to install:
  #	    [ ] base   [ ] debug   [ ] devel   [X] lib32   [ ] optional   [ ] src   [ ] tests
  #	    [ OK ]
  #
  # `lib32 32-bit compatibility libraries` comes ticked on this medium and nothing here needs it; the
  # rest are optional and this disk is a desktop, so the default set is taken as it stands.
  #
  # WITHOUT THIS RETURN the install never starts: `wait for the install to finish` reads this pane's
  # text for up to forty-five minutes and reports a phrase nobody wrote.
  key: ret
  wait_after: 15

- name: wait for the install to finish
  # The partitioner runs, the base system is extracted, and the installer finally reports
  # `Installation Completed` - this is the long wait, and it is a READING rather than a duration.
  loop:
    max: 180
    do:
    - wait: 15
    ocr:
      name: done
      # THE DIALOG, NOT THE WHOLE SCREEN, AND `scale: 3` BECAUSE THE TEXT IS SIXTEEN PIXELS.
      #
      # AT `scale: 1` OVER THE FULL FRAME THE READING WAS ONE LINE - the window's own title:
      #
      #	wait for the install to finish [check]: finished = false (none of "installation completed"
      #	  or "root password" or "system management account" or "add user" or "manual configuration"
      #	  in "FreeBSD Installer —")
      #
      # so the check could never be answered on a machine that had finished installing. MEASURED: the
      # dialog occupies x=600..940 y=340..580 at 1920x1080, and at 3x tesseract returns
      #
      #	Please select a passwort / account (root) / The password cannot be ... / Password
      #
      # (its own misspelling of "password" included, which is why the word list below does not depend
      # on that word alone).
      region:
      - 600
      - 340
      - 940
      - 580
      region_at:
      - 1920
      - 1080
      scale: 3
      wait: 0
    check:
      name: finished
      from: done
      # THE INSTALLER MOVES ON TO ITS POST-INSTALL MENU, AND THAT IS THE REAL END OF THE EXTRACTION.
      #
      # `Installation Completed` IS A LINE IT MAY NOT SHOW AT ALL. MEASURED ON THIS STAGE'S OWN RUN:
      # the loop spent forty-five minutes on a machine that had already finished, because the pane
      # that was on screen was
      #
      #	Please select a password for the system management account (root).
      #	Password:        [***********]
      #	Repeat password: [***********]
      #	                     [ OK ]  [ Help ]
      #
      # - the FIRST pane of the post-install menu. The base system was on the disk and the installer
      # was waiting for a person, which is the same shape as GhostBSD's `Installation Completed` and
      # was read past for the same reason: the words being waited for were not the words on screen.
      #
      # SO THE TEST IS THE POST-INSTALL MENU ITSELF, in any of the forms it takes - the root password
      # prompt first, then the menu with `Add User` and `Exit`.
      mode: says_any
      words:
      - - installation
        - completed
      - - account
        - root
      - - system
        - management
        - account
      - - repeat
        - password
      - - add
        - user
      - - manual
        - configuration
    until:
      fact: finished

# ==========================================================================================
# THE POST-INSTALL MENU, WHICH IS WHERE THE ACCOUNT AND THE BOOT LOADER ARE FINISHED
# ==========================================================================================
#
# `Installation Completed` IS NOT THE END OF THE INSTALLER. What follows is a sequence of panes, and
# THE ORDER WAS MEASURED BY HAND on this guest:
#
#	root password  ->  Add User  ->  ...  ->  network  ->  time zone  ->  ...  ->  Exit
#
# AND A `Return` IN A PASSWORD PANE SUBMITS IT. That is the opposite of what a GUI would do, and it is
# what made the first version of this file fail:
#
#	Please select a password for the system management account (root).
#	The passwords do not match.
#
#	Password:        [***********]
#	Repeat password: [***********]
#
# TWO FIELD PAIRS, EACH FILLED AND THEN MOVED PAST WITH `tab`, AND `tab` IS THE MOVE. `Return` at the
# end of the first field is a SUBMIT of a half-filled form - the error above is exactly what that looks
# like, and it does not clear when the second field is then filled.
# ==========================================================================================
# THE POST-INSTALL SEQUENCE, IN THE ORDER `bsdinstall auto` ACTUALLY RUNS IT
# ==========================================================================================
#
# THE ORDER IS NOT A GUESS. It is read from `usr.sbin/bsdinstall/scripts/auto`, which ends with:
#
#	bsdinstall rootpass || error "Could not set root password"
#	if [ "$NETCONFIG_DONE" != yes ]; then bsdinstall netconfig; fi
#	[ -z "$BSDINSTALL_SKIP_TIME" ]     && bsdinstall time
#	[ -z "$BSDINSTALL_SKIP_SERVICES" ] && bsdinstall services
#	[ -z "$BSDINSTALL_SKIP_HARDENING" ] && bsdinstall hardening
#	[ -z "$BSDINSTALL_SKIP_FIRMWARE" ] && bsdinstall firmware
#	[ -z "$BSDINSTALL_SKIP_USERS" ] && bsddialog --title "Add User Accounts" --yesno \
#	    "Would you like to add users to the installed system now?" 0 0 && bsdinstall adduser
#	[ -z "$BSDINSTALL_SKIP_FINALCONFIG" ] && bsdinstall finalconfig
#	bsdinstall config  || error "Failed to save config"
#	... "Manual Configuration" yesno -> chroot shell
#
# SO THERE ARE EIGHT PANES BETWEEN "the base system is on the disk" and "here is a root shell",
# AND THE EARLIER VERSION OF THIS FILE DID NOT KNOW THAT. It answered whatever was on screen with
# `ret` in a loop and stopped when it saw the word `exit`, which failed three ways:
#
#	Add User Accounts defaults to YES, so a blind Return launched adduser's prompt chain, and every
#	Return after that was an empty username:
#
#		adduser: ERROR: You must enter a username
#		Username: _
#
#	services is a CHECKLIST whose first entry is `sshd`, preselected. A Return there opens nothing
#	and the loop has already spent an attempt.
#
#	time is THREE panes (region, country, confirm) plus a date and a time box, so a blind Return
#	walks into a calendar the loop cannot read its way out of.
#
# THE ANSWER IS TO DRIVE EACH PANE BY NAME, in the order the script runs them, one step per pane.

# --- rootpass ------------------------------------------------------------------------------
#
# `Skip` IS A BUTTON, AND IT TAKES THREE KEYS TO REACH. MEASURED ON THIS PANE:
#
#	field --tab--> repeat field --tab--> [ OK ] --right--> [ Skip ] --ret--> out
#
# `right` ALONE DOES NOT WORK ONCE THE FIELDS HOLD TEXT: the focus is inside the password input, so
# right moves the CARET. The pane then sits on `The passwords do not match.` forever.
#
# AND THE FIELDS DO HOLD TEXT, because the walkthrough types into them - that is how `bsdinstall` is
# told the account password. What it does with that text is why this pane is skipped at all:
#
#	Password:        [***********]
#	Repeat password: [***********]
#	The passwords do not match.
#
# both halves filled from the same variable and the pane still reports a mismatch. `bsddialog`'s
# password widget echoes a fixed run of stars regardless of what it holds, so there is nothing to read
# back and no way to tell which half is wrong. The password is set later, in a root shell, with `pw`.
- name: the root password - first field
  type: '{{ password }}'
  wait_after: 2
- name: the root password - tab to the second field
  key: tab
  wait_after: 1
- name: the root password - second field
  type: '{{ password }}'
  wait_after: 2
- name: skip the root password pane
  do:
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: right
    wait_after: 1
  - key: ret
    wait_after: 8

# --- netconfig -----------------------------------------------------------------------------
#
# `Please select a network interface and configuration mode:` with `[ Auto ] [ Manual ]`. `Auto` is
# the default and is what runs `dhclient` on the virtio NIC - and `Auto` is also what makes the rest
# of netconfig non-interactive:
#
#	if [ ${IPV4_AVAIL} -eq 1 -a -z "$AUTO" ]; then    # only asks when NOT auto
#	    bsddialog --yesno 'Would you like to configure IPv4 for this interface?'
#
# so ONE Return here answers the whole netconfig stage. A guest that takes IPv6 as well is fine: the
# walkthrough does not depend on it.
- name: network - auto, which is the interface menu's default button
  key: ret
  wait_after: 15

# --- time ----------------------------------------------------------------------------------
#
# `tzsetup -s`, THEN a date box, THEN a time box, and BOTH boxes are `--default-no` with `Skip` as
# their cancel label. THE REGION LIST IS THE FIRST PANE OF `tzsetup`, and `UTC` is reached by
# choosing `UTC` in the region list rather than by walking into a country.
#
# THE DATE AND TIME BOXES ARE SKIPPED ON PURPOSE AND THAT IS NOT A SHORTCUT: a QEMU guest with
# `-rtc base=utc` already has the right time from the host, and a walkthrough that sets it by hand
# sets it to whenever the bake ran. `Skip` leaves the clock alone, which is the correct answer.
- name: time zone - the region list opens on UTC, which is the first entry
  key: ret
  wait_after: 6
- name: time zone - the date box, skipped
  # `--default-no` PUTS THE FOCUS ON `Skip`, so this Return takes it. That is the opposite of the
  # root password pane, where `Skip` needed `right` - the difference is `--default-no`, which
  # preselects the cancel button.
  key: ret
  wait_after: 4
- name: time zone - the time box, skipped
  key: ret
  wait_after: 4

# --- services ------------------------------------------------------------------------------
#
# `System Configuration: Choose the services you would like to be started at boot:`
#
#	[X] sshd          Secure shell daemon
#	[ ] ntpd          Synchronize system and network time
#	[X] dumpdev       Enable kernel crash dumps to /var/crash
#
# `sshd` IS PRESELECTED (its default is `on` in `services`), so the correct answer is to accept the
# list as it stands - which is the `[ OK ]` button, and it is where the focus already is.
#
# THIS IS ALSO THE PANE THE WHOLE SSH CHAIN DEPENDS ON. Measured on the disk this produces, booted
# with no CD: `Starting sshd` and a `login:` prompt, with `PasswordAuthentication` set by the chroot
# block further down.
- name: services - sshd is already ticked, so accept the list
  key: ret
  wait_after: 6

# --- hardening -----------------------------------------------------------------------------
#
# A CHECKLIST OF `hide_gids`, `hide_jail`, `read_msgbuf`, `proc_debug`, ... The repo's disk needs none
# of them and the list is all unchecked, so the `[ OK ]` button accepts an unmodified system.
- name: hardening - nothing to hide on a throwaway guest, so accept
  key: ret
  wait_after: 6

# --- firmware ------------------------------------------------------------------------------
#
# `Install Firmware (requires network)` is a `--no-cancel` menu whose only entries are `Skip` and
# `OK` in effect, and firmware packages are a hundred megabytes of wireless blobs for hardware this
# machine does not have.
- name: firmware - skip it
  key: ret
  wait_after: 10

# --- Add User Accounts ---------------------------------------------------------------------
#
# `Would you like to add users to the installed system now?`  [ Yes ]  [ No ]
#
# NO. THE ACCOUNT IS CREATED IN THE CHROOT SHELL INSTEAD, AND THIS IS THE PANE THAT BROKE THE
# EARLIER VERSION OF THIS FILE: this dialog DEFAULTS TO `Yes`, so a blind Return started
# `bsdinstall adduser` - a prompt CHAIN (`Username`, `Full name`, `Uid`, `Login class`, `Shell`,
# `Home`, `Home permissions`, ...) that aborts with
#
#	adduser: ERROR: You must enter a username
#
# if a Return arrives before a name is typed, and then sits at a SECOND `Username:` prompt no step
# was going to answer.
#
# `No` IS THE RIGHT BUTTON AND `right` REACHES IT, because this yesno's focus starts on `Yes`.
- name: do not add a user here - the chroot shell does it
  # `No` IS ALREADY HIGHLIGHTED, SO THIS IS ONE RETURN, AND THE `right` THAT WAS HERE MOVED IT OFF.
  #
  # MEASURED on the last frame of a local run (`ffmpeg -sseof -3` on the stage's own recording):
  #
  #	Add User Accounts
  #	  Would you like to add users to the installed system now?
  #	  [ Yes ]  [ No ]          <- NO is the blue button
  #
  # The step sent `key right` first, which moved the focus to Yes, so the Return started
  # `bsdinstall adduser` - the prompt CHAIN this step exists to avoid, and whose first failure is
  #
  #	adduser: ERROR: You must enter a username
  #
  # THE FOCUS RULES ARE NOT UNIFORM ACROSS THE INSTALLER, AND THAT IS THE TRAP. This pane opens on
  # `No`. The root-password pane needs two tabs plus `right` to reach `Skip`. The destroy-confirm
  # opens on `No` and needs `left`. The commit-confirm opens on `Commit` and needs nothing. Each was
  # measured on its own frame; none was inferred from the pane before it.
  key: ret
  wait_after: 8

# --- finalconfig ---------------------------------------------------------------------------
#
# `Final Configuration: Setup of your FreeBSD system is nearly complete. You can now modify your
# configuration choices.` A MENU whose FIRST ENTRY IS `Finish`:
#
#	>> Finish              Apply configuration and exit installer
#	   Add User            Add a user to the system
#	   Root Password       Change root password
#	   ...
#
# so one Return finishes it. THIS IS NOT THE SAME PANE AS `Exit The Installer`, which does not exist:
# `finalconfig` is a menu of things to CHANGE, and `Finish` is how it is left.
- name: final configuration - Finish is the first entry
  key: ret
  wait_after: 10

# --- the chroot shell ----------------------------------------------------------------------
#
# `The installation is now finished. Before exiting the installer, would you like to open a shell in
# the new system to make any final manual modifications?`  [ Yes ]  [ No ]
#
# THIS DIALOG IS `--default-no`, so `No` holds the focus and `left` moves to `Yes`. MEASURED: the
# pane opens with `[ Yes ] [ No ]` and NO highlighted, and `left` then `ret` gets the root shell.
#
# THIS IS THE ONLY PLACE IN THE WHOLE WALKTHROUGH WHERE A REAL ROOT SHELL EXISTS, which is why every
# privileged setting is written here rather than through a dialog.
- name: open a shell in the new system
  do:
  - key: left
    wait_after: 1
  - key: ret
    wait_after: 12

# ROOT GETS THE PASSWORD THE INSTALLER WAS TOLD, VIA A TOOL THAT CANNOT DISAGREE WITH ITSELF.
#
# `pw usermod -h 0` READS THE PASSWORD FROM STDIN, which is why `printf` pipes into it: the tool does
# not take a password argument, on purpose - an argument is visible in `ps`.
- name: set the root password
  do:
  - type: printf '%s\n' '{{ password }}' | pw usermod root -h 0
    wait_after: 3
  - key: ret
    wait_after: 5

# THE ACCOUNT, WITH `wheel` SO IT CAN ESCALATE.
#
# `-G wheel` IS THE WHOLE REASON `su` WORKS FROM IT LATER: FreeBSD's `su` consults `pam_group` with
# `group=wheel`, and a user outside it is refused with `su: Sorry` - MEASURED on a disk from this
# walk, before this line existed.
#
# `-m` CREATES THE HOME DIRECTORY AND `-s` SETS THE SHELL, both of which matter: without a shell the
# account exists and cannot log in over ssh, which reads afterwards as an ssh failure.
- name: create the account
  do:
  - type: printf '%s\n' '{{ password }}' | pw useradd -n {{ user }} -m -s /bin/csh -G wheel -h 0
    wait_after: 3
  - key: ret
    wait_after: 5

- name: prove the account exists
  # THE OUTPUT IS THE EVIDENCE, and a walkthrough that creates an account without reading it back is
  # one that discovers the mistake at the ssh stage instead of here.
  do:
  - type: pw usershow {{ user }}
    wait_after: 2
  - key: ret
    wait_after: 4

# SSHD REFUSES PASSWORDS UNTIL TOLD OTHERWISE, AND THIS SHELL IS THE ONLY PLACE THAT CAN SAY SO.
#
# MEASURED at the ssh stage: `the port is open but no shell answers: ssh: unable to authenticate,
# attempted methods [none keyboard-interactive]`. The port answered because `services` enabled sshd;
# the REFUSAL is FreeBSD's default `PasswordAuthentication no`, and a guest whose only credential is
# a password cannot be driven at all.
#
# `PermitRootLogin` IS LEFT ALONE ON PURPOSE. Its default is `prohibit-password`, which is right: the
# stages log in as the unprivileged account, and root over ssh is not a door this walkthrough opens.
#
# `sed -i ''` IS BSD SED'S FORM: the empty backup suffix is not optional, and a Linux `sed -i` here
# consumes the next argument as its suffix and edits nothing.
- name: allow password authentication over ssh
  do:
  - type: sed -i '' 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
    wait_after: 3
  - key: ret
    wait_after: 4

- name: prove the setting took
  # `grep -c` PRINTS A NUMBER, so the log says `1` rather than only that the command exited 0.
  do:
  - type: grep -c '^PasswordAuthentication yes' /etc/ssh/sshd_config
    wait_after: 2
  - key: ret
    wait_after: 4

- name: make sure sshd starts at every boot
  do:
  - type: sysrc sshd_enable=YES
    wait_after: 2
  - key: ret
    wait_after: 4

# SUDO, BECAUSE `su` CANNOT WORK ON AN SSH CHANNEL AND `pkg` NEEDS ROOT.
#
# MEASURED TWICE, ON DIFFERENT DISKS:
#
#	the ssh stage, with `pkg install` as the unprivileged account:
#		pkg: Insufficient privileges to install packages
#
#	the console, piping the root password into `su`:
#		BAD SU vmuser to root on /dev/pts/0
#
# The second one is the one that decides the design. FreeBSD's `su` reads the password from
# `/dev/tty` - NOT stdin - and an `ssh:` command has no terminal, so `printf pw | su -c ...` is
# answered with `su: Sorry` even when the password is correct. `script -q /dev/null` was tried too,
# because it does allocate a pty: still `BAD SU`, because PAM's `pam_group` sees the request arriving
# before the pty has a controlling terminal.
#
# THE BASE SYSTEM HAS NO OTHER OPTION: `sudo` and `doas` are both in ports, not in base. So the one
# place a real root shell exists - this chroot - is where the escalation tool has to be installed.
#
# AND IT IS THE SAME ANSWER EVERY OTHER SYSTEM HERE ALREADY GIVES. Ubuntu's autoinstall writes
# /etc/sudoers.d/90-... with NOPASSWD; macOS uses `printf pw | sudo -S -p ''`; the reference
# implementation's FreeBSD bake does exactly this (`pkg install sudo` plus a NOPASSWD sudoers file).
# Root over ssh stays closed: `PermitRootLogin` keeps its `prohibit-password` default, so the stages
# log in as the unprivileged account and escalate, which is the shape the other three already use.
#
# THE PARTITIONER IS ALREADY SEEDED, because `pkg` on a fresh install has no database. That is also
# what makes the later `pkg install xfce` a download of its own rather than a re-bootstrap.
- name: install sudo
  # A FIXED WAIT WAS THE BUG, AND THE SYMPTOM WAS THREE STEPS AWAY.
  #
  # MEASURED ON CI, run 43629665299: this step typed the command, waited 90 seconds, and pressed
  # Return. The install stage then REPORTED SUCCESS - 48 of 48 - and the ssh stage failed with
  #
  #	/usr/local/bin/sudo: Exec format error. Binary file not executable.
  #
  # which is what a TRUNCATED binary looks like. `pkg` was still unpacking when the Return arrived,
  # and the keystroke went to the console of a running install rather than after it.
  #
  # SO THE STEP DOES NOT GUESS: it asks `pkg` to finish, then polls for the file to stop changing.
  # `pkg info sudo` is the installer's own record that the package is registered, which only happens
  # once unpacking is complete - a half-written binary is never registered.
  do:
  - type: env ASSUME_ALWAYS_YES=yes pkg install -y sudo
    wait_after: 4
  - key: ret
    wait_after: 20
  # THE POLL LOOPS IN THE GUEST, because a `loop:` here would spend a step per attempt and this is
  # one question with one answer. Thirty tries at five seconds is two and a half minutes, which is
  # generous for a one-megabyte package and still bounded.
  - type: sh -c 'i=0; while [ $i -lt 30 ]; do pkg info sudo >/dev/null 2>&1 && break; sleep 5; i=$((i+1)); done; pkg info sudo 2>&1 | head -2'
    wait_after: 3
  - key: ret
    wait_after: 25

- name: prove sudo arrived
  # THE OUTPUT IS THE EVIDENCE, AND IT HAS TO NAME THE FILE, NOT ONLY ITS PRESENCE.
  #
  # MEASURED ON CI, run 43629665299's ssh leg:
  #
  #	/usr/local/bin/sudo: Exec format error. Binary file not executable.
  #
  # `pkg install` reported success and the file is there - so `which sudo` would have passed and told
  # us nothing. `file` says WHAT arrived, which is the question `Exec format error` is asking: an ELF
  # for another architecture, a truncated download, or a text stub all produce it.
  #
  # `ls -l` IS HERE FOR THE OTHER HALF: `Exec format error` is also what a file with no execute bit
  # produces on some kernels, and the mode is one line away from the name.
  do:
  - type: ls -l /usr/local/bin/sudo
    wait_after: 2
  - key: ret
    wait_after: 3
  - type: file /usr/local/bin/sudo
    wait_after: 2
  - key: ret
    wait_after: 4

- name: let the account escalate without a password
  # THE MODE IS 0440 BECAUSE SUDO REFUSES A SUDOERS FILE ANYONE ELSE CAN READ, and the DIRECTORY is
  # created by the package - so this runs after the install above, never before it.
  #
  # `{{ user }}` RATHER THAN A FIXED NAME: the account is a variable of this walkthrough, and a
  # sudoers line that names a different one is a permission error at the first privileged command.
  do:
  - type: printf '%s\n' '{{ user }} ALL=(ALL) NOPASSWD:ALL' > /usr/local/etc/sudoers.d/90-{{ user }}
    wait_after: 2
  - key: ret
    wait_after: 3
  - type: chmod 0440 /usr/local/etc/sudoers.d/90-{{ user }}
    wait_after: 2
  - key: ret
    wait_after: 3

- name: prove sudo works, as the account will use it
  # `su -m {{ user }} -c ...` RUNS IT AS THE ACCOUNT rather than as root, so this is the real question
  # and not a weaker one. `sudo -n` means "never prompt", so a sudoers file that did not take fails
  # here instead of hanging at a password prompt in the next stage.
  do:
  - type: su -m {{ user }} -c 'sudo -n id -un'
    wait_after: 3
  - key: ret
    wait_after: 6

- name: leave the shell, which finishes the install
  do:
  - type: exit
    wait_after: 2
  - key: ret
    wait_after: 15

- name: flush the writes before anything else
  # `sync` IS NOT ENOUGH ON THIS DISK, AND THE MEASUREMENT SAYS WHY.
  #
  # `sync` was added when the first publish came out with `/usr/local/bin/sudo` as 228312 bytes of
  # zeros. It helped - sudo survived the next run - and the xorg install then came out with
  #
  #	/usr/local/libexec/Xorg          2387344 bytes, ALL ZEROS
  #	153 of 109986 files under /usr/local empty
  #	/bin/sh                          intact, ELF
  #
  # and the reason is the filesystem, not the flush:
  #
  #	df /              /dev/vtbd0p2          <- UFS
  #	sudo zpool status "no pools available"  <- NO ZFS AT ALL
  #
  # THE INSTALLER WAS ASKED FOR ZFS AND PRODUCED UFS. `partitioning - automatic zfs` presses `down`
  # then `ret`, which selects `Auto (ZFS)` on the menu as this file documents - and the disk that
  # came out has one UFS partition and no pool. Whatever the menu did, the RESULT is measured here
  # rather than trusted, because every stage after this one depends on it.
  #
  # TWO FLUSHES, BECAUSE UFS AND ZFS FAIL DIFFERENTLY: `sync` hands over the buffer cache in both
  # cases, and the second one is what a UFS filesystem needs before its superblock is trusted.
  do:
  - type: sync
    wait_after: 3
  - key: ret
    wait_after: 20
  - type: sync
    wait_after: 3
  - key: ret
    wait_after: 20

- name: prove the disk is the filesystem this file asked for
  # THE ONE FACT EVERY LATER STAGE RELIES ON, AND IT WAS NEVER CHECKED. A UFS disk works, so nothing
  # failed loudly - it just lost 153 files to an unclean shutdown, and the loss surfaced two stages
  # later as `Exec format error` on a binary nobody had touched.
  do:
  - type: sh -c 'df -h / | tail -1; zpool list 2>&1 | head -2'
    wait_after: 3
  - key: ret
    wait_after: 6

- name: stop the machine
  # A STAGE WHOSE OUTPUT IS THE DISK MAY NOT LOSE ITS WRITES, AND `sync` ABOVE IS HOW THAT IS GUARANTEED.
  #
  # `kill` RATHER THAN `acpi`, AND THE REASON IS THE INSTALLER, NOT THIS STAGE: `TestAnInstallStopsThe
  # MachineBeforePublishingTheDisk` requires it of every install leg, because a live installer's init
  # ignores ACPI and the run then waits out its timeout for a power-off nobody performs.
  #
  # THE FLUSH IS THE STEP BEFORE THIS ONE. Before `sync` existed here, this line was `kill` with a
  # comment that already said the disk may not be killed - and the disk came out with `pkg` and `sudo`
  # as zero-filled files, because nothing had been written back.
  shutdown: '{{ shutdown }}'
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
