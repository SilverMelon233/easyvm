name: opensuse-tumbleweed - the YaST2 walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - opensuse-leap-16.1.iso
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: opensuse-leap-16.1.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/kde
  timeout: 5400
- name: open yast2
  double:
  - 267
  - 34
  settle: 40
- name: open yast2 - what is on screen
  see:
    of: [text]
    name: open_yast2
    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
    wait: 0
- name: open yast2 - the screen says so
  check:
    name: asserted
    from: open_yast2
    mode: says_any
    words:
    - [installation]
    - [upgrade]
    - [language]
- name: open yast2 (once more, if it did not)
  when_not_any:
  - - installation
  - - upgrade
  - - language
  double:
  - 267
  - 34
  settle: 45
- name: welcome
  click:
  - 1596
  - 859
  settle: 30
- name: online repositories - no
  click:
  - 1004
  - 614
  settle: 20
- name: role - desktop with kde plasma
  click:
  - 588
  - 333
  settle: 6
- name: system role
  click:
  - 1596
  - 859
  settle: 30
- name: suggested partitioning
  click:
  - 1596
  - 859
  settle: 25
- name: clock and time zone
  click:
  - 1596
  - 859
  settle: 22
- name: local user - full name
  click:
  - 1106
  - 418
  type: '{{ user }}'
  settle: 2
- name: local user - user name, select all
  click:
  - 1106
  - 483
  settle: 2
- name: local user - user name, clear it
  key: ctrl+a
  settle: 2
- name: local user - user name, delete the selection
  key: backspace
  settle: 2
- name: local user - user name
  type: '{{ user }}'
  settle: 2
- name: local user - password
  click:
  - 1106
  - 548
  type: '{{ password }}'
  settle: 2
- name: local user - confirm password
  click:
  - 1106
  - 614
  type: '{{ password }}'
  settle: 3
- name: local user
  click:
  - 1596
  - 859
  settle: 18
- name: accept the weak password
  key: ret
  settle: 22
- name: install
  click:
  - 1587
  - 859
  settle: 15
- name: the confirm installation dialog's install
  click:
  - 922
  - 707
  settle: 25
- name: the install runs, as measured
  settle: 1800
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'