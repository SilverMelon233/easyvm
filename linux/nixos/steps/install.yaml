name: nixos - the Calamares walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - nixos.iso
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: nixos.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
- name: open the installer
  do:
  - click:
    - 960
    - 640
    settle: 3
  - click:
    - 960
    - 640
    settle: 3
  settle: 8
- name: open the installer - what is on screen
  see: {name: open_the_installer}
- name: open the installer - the screen says so
  check:
    name: asserted
    from: open_the_installer
    mode: text
    words:
    - [welcome]
    - [language]
    - [install]
    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
- name: open the installer (desktop icon, if the window was not there)
  when_not:
  - welcome
  - language
  settle: 8
  do:
  - click:
    - 88
    - 240
    settle: 3
  - click:
    - 88
    - 240
    settle: 3
- name: open the installer (desktop icon again)
  when_not:
  - welcome
  - language
  settle: 25
  do:
  - click:
    - 88
    - 240
    settle: 3
  - click:
    - 88
    - 240
    settle: 3
- name: calamares is up
  loop:
    max: 30
    do:
    - click:
      - 420
      - 300
      settle: 10
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - welcome
      - - language
      - - keyboard
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: welcome
  at_bottom:
  - 1327
  - 15
  settle: 15
- name: location
  at_bottom:
  - 1327
  - 15
  settle: 15
- name: keyboard
  at_bottom:
  - 1327
  - 15
  settle: 15
- name: users - what is your name
  click:
  - 700
  - 377
  type: '{{ user }}'
  settle: 2
- name: users - login name, focus the field
  click:
  - 700
  - 429
  settle: 1
- name: users - login name, select all
  key: ctrl+a
  settle: 1
- name: users - login name, clear it
  key: backspace
  settle: 1
- name: users - login name
  click:
  - 700
  - 429
  type: '{{ user }}'
  settle: 2
- name: users - allow a short password
  click:
  - 630
  - 532
  settle: 3
- name: users - password
  click:
  - 700
  - 494
  type: '{{ password }}'
  settle: 2
- name: users - repeat password
  click:
  - 900
  - 494
  type: '{{ password }}'
  settle: 2
- name: users - administrator password
  click:
  - 700
  - 603
  type: '{{ password }}'
  settle: 2
- name: users - administrator repeat password
  click:
  - 900
  - 603
  type: '{{ password }}'
  settle: 3
- name: users
  at_bottom:
  - 1327
  - 15
  settle: 18
- name: choose gnome
  click:
  - 1000
  - 400
  settle: 4
- name: packagechooser
  at_bottom:
  - 1327
  - 15
  settle: 15
- name: unfree notes
  at_bottom:
  - 1327
  - 15
  settle: 12
- name: partitions - erase the disk
  click:
  - 633
  - 390
  settle: 6
- name: partitions
  at_bottom:
  - 1327
  - 15
  settle: 18
- name: summary - install
  at_bottom:
  - 1327
  - 15
  settle: 25
- name: the install is written
  disk_settle: 180
  disk_min_mb: 1024
  timeout: 3600
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'