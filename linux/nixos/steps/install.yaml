name: nixos - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - nixos.iso
- name: start recording
  record: nixos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: nixos.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
  poll: 5
  keep_alive: true
# THE CLICK THAT OPENS THE INSTALLER DOES NOT ALSO GET TO DECIDE WHETHER IT OPENED.
#
# MEASURED, on this medium: this step carried `expect_any: [welcome | language | install]` and an
# 8-second `wait_after`, and it FAILED with
#
#	open the installer: did not advance: wanted "welcome" or "language" or "install",
#	                   read "-_- Nov 17 13:30 mm O Q Type to search"
#
# - the reading was the DESKTOP's status bar, one frame before the window appeared. A screenshot
# taken right after showed `Welcome to the NixOS installer` plainly on screen. The window was
# opening; the verdict was taken too early, and it is a VERDICT, so the walk stopped there and the
# retry loop below (`calamares is up`, 30 attempts) never got to run.
#
# SO THIS STEP ONLY CLICKS. The waiting belongs to the loop, which is allowed to be wrong thirty
# times; a check on a single click is allowed to be wrong once and ends the run.
- name: open the installer
  wait_after: 8
  do:
  - click:
    - 960
    - 640
    wait_after: 3
  - click:
    - 960
    - 640
    wait_after: 3
- name: calamares is up
  loop:
    max: 30
    do:
    - click:
      - 420
      - 300
      wait_after: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
      - - language
      - - keyboard
    until:
      fact: done
- name: welcome
  click:
  - 1329
  - 836
  wait_after: 15
- name: location
  click:
  - 1329
  - 836
  wait_after: 15
- name: keyboard
  click:
  - 1329
  - 836
  wait_after: 15
# THE USERS PAGE HAS TO BE UP BEFORE ANYTHING IS TYPED INTO IT, AND ON CI IT WAS NOT.
#
# MEASURED on the CI leg: every field in this page reported `typed N character(s)` and the install
# still never started, because the FIRST field - `What is your name?` - took no text. `click` followed
# immediately by `type:` is a press and then keystrokes; if the page is still laying itself out, the
# press lands on the old page and the typing goes nowhere. On this workstation the page is drawn by
# the time the click arrives; on the runner it is not.
#
# SO THE PAGE IS WAITED FOR BY ITS OWN FIRST LABEL, which is a word the previous page (Desktop) does
# not carry.
- name: the users page is drawn
  loop:
    max: 30
    do:
    - wait: 6
    ocr:
      name: at_users
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 2
    check:
      name: here
      from: at_users
      mode: says_any
      words:
      - - name
      - - Password
    until:
      fact: here

# THE FIRST FIELD TAKES NO TEXT ON THE RUNNER, AND `clear:` IS WHAT MAKES THAT VISIBLE.
#
# MEASURED on the CI leg: `the users page is drawn` passed - the page WAS up - and then
#
#	=== users - what is your name
#	  typed 6 character(s)
#
# while the field stayed empty, so Calamares kept `Next` grey and the install never started. The
# press lands at (718, 377) and this workstation types into it; the runner's window is a few pixels
# elsewhere and the press misses the box.
#
# `clear:` MAKES THE STEP SELF-CORRECTING rather than merely visible: it selects the field's contents
# and deletes them before typing, which is a no-op on an empty box and puts the caret in it when the
# press DID land. Every other field on this page already does this; the first one did not, because it
# is the one that starts empty.
- name: users - what is your name
  click:
  - 718
  - 377
  clear: true
  type: '{{ user }}'
  wait_after: 2

- name: the name took, or the field would still be empty
  loop:
    max: 8
    do:
    - wait: 1
    ocr:
      name: name_field
      region: [560, 340, 1200, 420]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: took
      from: name_field
      mode: says_any
      words:
      - - '{{ user }}'
    until:
      fact: took
- name: users - login name, select all
  click:
  - 700
  - 429
  key: ctrl+a
  wait_after: 1
- name: users - login name, clear it
  key: backspace
  wait_after: 1
- name: users - login name
  click:
  - 700
  - 429
  type: '{{ user }}'
  wait_after: 2
- name: users - allow a short password
  click:
  - 630
  - 532
  wait_after: 3
- name: users - password
  click:
  - 700
  - 494
  type: '{{ password }}'
  wait_after: 2
- name: users - repeat password
  click:
  - 900
  - 494
  type: '{{ password }}'
  wait_after: 2
- name: users - administrator password
  click:
  - 700
  - 603
  type: '{{ password }}'
  wait_after: 2
- name: users - administrator repeat password
  click:
  - 900
  - 603
  type: '{{ password }}'
  wait_after: 3
- name: users
  click:
  - 1329
  - 836
  wait_after: 18
- name: choose gnome
  click:
  - 1000
  - 400
  wait_after: 4
- name: packagechooser
  click:
  - 1329
  - 836
  wait_after: 15
- name: unfree notes
  click:
  - 1329
  - 836
  wait_after: 12
- name: partitions - erase the disk
  click:
  - 633
  - 390
  wait_after: 6
- name: partitions
  click:
  - 1329
  - 836
  wait_after: 18
# THE SUMMARY PAGE'S `Install` IS 31 PIXELS LOWER THAN THE OTHER PAGES' `Next`.
#
# MEASURED on this installer's own frames: the footer sits at y=557 in the 1280-wide view on every
# page (`Next` at (1329, 836) on the 1920 frame), and on the summary page the button is at y=578 -
# (1329, 867) - because that page's content is taller and the footer is laid out under it. This is the
# same difference Calamares shows on cachyos and on endeavouros.
#
# MEASURED on the CI leg: (1329, 836) was pressed on the summary page and the install never started -
# the press landed on the page's own progress text, which is what sits above that footer.
- name: summary - install
  click:
  - 1329
  - 867
  wait_after: 25
- name: the install is written
  disk_settle: 180
  disk_min_mb: 1024
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
