name: popos - the pop installer walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - popos.iso
- name: start recording
  record: popos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: popos.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
- name: open the installer from the dock
  # 1390 IS 310 PIXELS BELOW THE BOTTOM OF A 1080 FRAME, so these numbers were taken on a taller
  # screen and never rescaled. Found by the ported `TestEveryCoordinateFitsTheFrameItDeclares`
  # (upstream `aac5fc0`), whose message is the one the daemon used to print at step 6 of 29 with the
  # machine already booted:
  #
  #	open the installer from the dock: pointer to (1265, 1390): outside a 1920x1080 frame
  #
  # The dock was located by its own pixels on the 1920 frame: crop 700..1600 x 1020..1080 scaled 2x
  # puts the installer ring at (700+1022/2, 1020+60/2) = (1211, 1050). The x range was already right,
  # which is what makes this a height error rather than a typo.
  at_button:
  - 1190
  - 1030
  - 1235
  - 1070
  at_fallback:
  - 1211
  - 1050
  settle: 20
- name: the installer window is up
  loop:
    max: 100
    do:
    - click:
      - 420
      - 300
      settle: 3
    see:
      of: [text]
      name: screen
      rect:
      - 0
      - 0
      - 1920
      - 1080
      rect_at:
      - 1920
      - 1080
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - select
        - a
        - language
      - - clean
        - install
      - - erase
        - and
        - install
      - - full
        - name
    until:
      fact: done
- name: select a language
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  settle: 21
- name: language variants
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  settle: 21
- name: keyboard layout
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  settle: 21
- name: keyboard variants
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  settle: 21
- name: clean install
  click:
  - 1180
  - 456
  settle: 8
- name: install
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  settle: 21
- name: select a drive
  click:
  - 1193
  - 498
  settle: 8
- name: erase and install
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  settle: 44
- name: wait for the account pane
  loop:
    max: 45
    do:
    - settle: 2
    see:
      of: [text]
      name: screen
      rect:
      - 0
      - 0
      - 1920
      - 1080
      rect_at:
      - 1920
      - 1080
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - Full
      - Name
      - User
    until:
      fact: done
- name: type the display name
  click:
  - 1188
  - 494
  type: VM User
  type_gap: 0.09
  settle: 2
- name: leave the field so it validates
  key: tab
  settle: 2
- name: create user account
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  settle: 22
- name: wait for the password pane
  loop:
    max: 45
    do:
    - settle: 2
    see:
      of: [text]
      name: screen
      rect:
      - 0
      - 0
      - 1920
      - 1080
      rect_at:
      - 1920
      - 1080
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - Choose
        - Account
        - Password
      - - Account
        - Password
    until:
      fact: done
- name: dismiss anything a stray click opened
  key: esc
  settle: 2
- name: type the password
  click:
  - 1350
  - 447
  type: '{{ password }}'
  type_gap: 0.09
  settle: 2
- name: confirm the password
  click:
  - 1350
  - 543
  type: '{{ password }}'
  type_gap: 0.09
  settle: 2
- name: account password next
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  settle: 25
- name: drive encryption - don't encrypt
  click:
  - 1081
  - 808
  settle: 35
- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
