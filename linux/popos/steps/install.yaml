name: popos - the pop installer walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - popos.iso
- name: start recording
  record: popos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: popos.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
  poll: 5
  keep_alive: true
# THE DOCK ICON IS AT y=1050, NOT y=1340 - THOSE COORDINATES WERE FROM A 2560x1440 FRAME.
#
# MEASURED: this file declares `resolution: [1920, 1080]` and the previous values made the daemon
# refuse the step outright:
#
#	open the installer from the dock: pointer to (1265, 1390): outside a 1920x1080 frame
#
# 1390 IS 310 PIXELS BELOW THE BOTTOM OF A 1080 FRAME, so the numbers were taken on a taller screen
# and never rescaled. The dock was located by its own pixels on the 1920 frame: crop 700..1600 x
# 1020..1080 scaled 2x puts the installer's ring icon at (700+1022/2, 1020+60/2) = (1211, 1050).
#
# THE x RANGE WAS ALREADY RIGHT, which is what makes this a height error rather than a typo: the
# icon sits at x~1211 on both frames because the dock is centred and narrower than the screen.
- name: open the installer from the dock
  at_button:
  - 1190
  - 1030
  - 1235
  - 1070
  at_fallback:
  - 1211
  - 1050
  wait_after: 20
- name: the installer window is up
  loop:
    max: 100
    do:
    - click:
      - 420
      - 300
      wait_after: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - select
        - a
        - language
      - - clean
        - install
      - - erase
        - and
        - install
      - - full
        - name
    until:
      fact: done
- name: select a language
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: language variants
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: keyboard layout
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: keyboard variants
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: clean install
  click:
  - 1180
  - 456
  wait_after: 8
- name: install
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: select a drive
  click:
  - 1193
  - 498
  wait_after: 8
- name: erase and install
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 44
# THE ACCOUNT PANE PRINTS `Create User Account`, AND THE OLD CHECK ASKED FOR WORDS IT NEVER SHOWS.
#
# MEASURED, tesseract over this pane's own frame:
#
#	Install Pop!_OS 24.04 LTS
#	Choose Account Password
#	Confirm Password
#	Create User Account
#
# - no `Full`, no `Name`, no `User` as separate words. `says` requires EVERY entry to be present, so
# this loop could not pass and ran all 45 attempts on a page that was plainly up. The steps after it
# then clicked into whatever the page had become by the time the loop gave up.
- name: wait for the account pane
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - Account
      - - User
    until:
      fact: done
- name: type the display name
  click:
  - 1195
  - 443
  type: VM User
  type_gap: 0.09
  wait_after: 2
- name: leave the field so it validates
  key: tab
  wait_after: 2
- name: create user account
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  # THE FALLBACK IS THE BUTTON'S CENTRE, MEASURED, AND IT IS REQUIRED RATHER THAN A NICETY.
  #
  # MEASURED on the CI leg: `create user account: no control fill in [1240,755 1430,845], and no
  # `at_fallback:` to use instead: the dominant colour there is too small to be a control, or there
  # is none`. The scan looks for a filled rectangle of one colour inside that box; on the runner the
  # button is drawn with the same fill as its pane and the scan found nothing, while the button was
  # there and clickable. This is the same failure `open the installer from the dock` had on this
  # medium, and the same answer: a measured point rather than a scan.
  at_fallback:
  - 1366
  - 811
  wait_after: 22
- name: wait for the password pane
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - Choose
        - Account
        - Password
      - - Account
        - Password
    until:
      fact: done
- name: dismiss anything a stray click opened
  key: esc
  wait_after: 2
# THE PASSWORD FIELDS ARE AT x=1195, AND `Next` STAYS GREY WHILE THE FIRST ONE IS EMPTY.
#
# MEASURED on the live page. The field spans x=970..1425, so 1350 IS inside it and the click was
# never "outside the box" - but the box only takes the caret when the press lands while the field
# has focus, and a press into the right third of this one did not. Clicking the field's own centre
# and typing was measured working:
#
#	click (1195,445) then type -> "•••••  ⚠ The password is shorter than 8 characters"
#
# `admin` IS SHORT AND THAT IS NOT A REFUSAL: the warning is drawn and `Next` turns GREEN anyway,
# exactly as `Password is too short` is a warning in kubuntu's Calamares. The confirm field is the
# same box 102 pixels lower: (1195, 547).
- name: type the password
  click:
  - 1195
  - 445
  type: '{{ password }}'
  type_gap: 0.09
  wait_after: 2
- name: confirm the password
  click:
  - 1195
  - 547
  type: '{{ password }}'
  type_gap: 0.09
  wait_after: 2
- name: account password next
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  at_fallback:
  - 1366
  - 811
  wait_after: 25
- name: drive encryption - don't encrypt
  click:
  - 1081
  - 808
  wait_after: 35
- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
