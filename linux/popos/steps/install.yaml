name: popos - the pop installer walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - popos.iso
- name: start recording
  record: popos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: popos.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
  poll: 5
  keep_alive: true
# THE DOCK ICON IS AT y=1050, NOT y=1340 - THOSE COORDINATES WERE FROM A 2560x1440 FRAME.
#
# MEASURED: this file declares `resolution: [1920, 1080]` and the previous values made the daemon
# refuse the step outright:
#
#	open the installer from the dock: pointer to (1265, 1390): outside a 1920x1080 frame
#
# 1390 IS 310 PIXELS BELOW THE BOTTOM OF A 1080 FRAME, so the numbers were taken on a taller screen
# and never rescaled. The dock was located by its own pixels on the 1920 frame: crop 700..1600 x
# 1020..1080 scaled 2x puts the installer's ring icon at (700+1022/2, 1020+60/2) = (1211, 1050).
#
# THE x RANGE WAS ALREADY RIGHT, which is what makes this a height error rather than a typo: the
# icon sits at x~1211 on both frames because the dock is centred and narrower than the screen.
- name: open the installer from the dock
  at_button:
  - 1190
  - 1030
  - 1235
  - 1070
  # MEASURED, AND IT WAS REMOVED BY ACCIDENT: the script that replaced the seven footer presses with
  # `at_color` deleted EVERY `at_fallback:` in the file, including this one - which belongs to the
  # dock icon and not to a footer. MEASURED on the next run:
  #
  #	open the installer from the dock: no control fill in [1190,1030 1235,1070], and no
  #	`at_fallback:` to use instead
  at_fallback:
  - 1211
  - 1050
  wait_after: 20
- name: the installer window is up
  loop:
    max: 100
    do:
    - click:
      - 420
      - 300
      wait_after: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - select
        - a
        - language
      - - clean
        - install
      - - erase
        - and
        - install
      - - full
        - name
    until:
      fact: done
# THE WIZARD, WALKED BY HAND ON THIS WORKSTATION, PAGE BY PAGE.
#
# EVERY COORDINATE AND COLOUR BELOW WAS TAKEN OFF A FRAME OF THE PAGE IT PRESSES, and the two things
# that made the previous version fail are both here:
#
#	A BUTTON IS DARK (rgb(50,50,50)) UNTIL IT IS ENABLED. `at_color` on the accent only ever finds a
#	button that is already pressable, so the STEP BEFORE each press must select whatever enables it.
#
#	`Erase and Install` IS RED (rgb(234,144,144)), NOT GREEN. The wizard's destructive action has its
#	own colour, and a search for the accent never sees it.
#
#	THE KEYBOARD PAGE CAN LAND ON `Arabic (Iraq)` AND THEN ALL TYPED TEXT BECOMES ARABIC - measured,
#	`VM User` came out as `سنتق`. So the keyboard's `Default` entry is chosen explicitly.
#
# THE FOOTER IS (1367, 811) ON EVERY PAGE OF THIS WIZARD, measured on four of them.
- name: select a language
  at_color:
  - 144
  - 207
  - 176
  color_tolerance: 30
  color_region:
  - 1100
  - 700
  - 1920
  - 900
  wait_after: 6

- name: the keyboard page is up
  loop:
    max: 20
    do:
    - wait: 3
    ocr:
      name: kb
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: there
      from: kb
      mode: says_any
      # `Layout` AND `Type to test` ARE THIS PAGE'S OWN; the language page above it has neither.
      words:
      - - Layout
      - - Type
    until:
      fact: there

# THE KEYBOARD'S OWN `Default` ENTRY, which is what keeps the layout US. MEASURED: the list's first
# entry reads `A user-defined custom Layout`, then alphabetical names, and `Default` sits at the top of
# the INPUT-LANGUAGE list behind the first entry. Choosing `Default` is what the hand run did before
# `VM User` typed correctly.
- name: the keyboard layout's Default, which is US
  click:
  - 1192
  - 285
  wait_after: 3

- name: take the keyboard layout
  at_color:
  - 144
  - 207
  - 176
  color_tolerance: 30
  color_region:
  - 1100
  - 700
  - 1920
  - 900
  wait_after: 6

- name: the install page is up
  loop:
    max: 20
    do:
    - wait: 3
    ocr:
      name: inst
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: there
      from: inst
      mode: says_any
      words:
      - - Clean
      - - Custom
    until:
      fact: there

# `Clean Install` IS A RADIO, AND NOTHING IS SELECTED WHEN THE PAGE OPENS - so `Next` is dark until it
# is pressed. MEASURED: the radio's own row spans y 415..455, x 990..1300; its centre is (1000, 433).
- name: clean install
  click:
  - 1000
  - 433
  wait_after: 3

- name: install
  at_color:
  - 144
  - 207
  - 176
  color_tolerance: 30
  color_region:
  - 1100
  - 700
  - 1920
  - 900
  wait_after: 6

- name: the drive page is up
  loop:
    max: 20
    do:
    - wait: 3
    ocr:
      name: drv
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: there
      from: drv
      mode: says_any
      words:
      - - drive
      - - Virtio
    until:
      fact: there

# THE DISK MUST BE SELECTED before `Erase and Install` is drawn in its own colour. MEASURED: the row
# reads `Virtio Block Device /dev/vda 128.0 GB` and its centre is (1185, 497).
- name: select a drive
  click:
  - 1185
  - 497
  wait_after: 4

# `Erase and Install` IS RED - rgb(234,144,144), measured over its own box, 3436 pixels. IT IS THE
# WIZARD'S DESTRUCTIVE ACTION AND IT HAS ITS OWN COLOUR, so the accent search never sees it.
- name: erase and install
  at_color:
  - 234
  - 144
  - 144
  color_tolerance: 30
  color_region:
  - 1200
  - 700
  - 1920
  - 900
  wait_after: 10

- name: wait for the account pane
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - Account
      - - User
    until:
      fact: done
- name: type the display name
  click:
  - 1195
  - 443
  type: VM User
  type_gap: 0.09
  wait_after: 2
- name: leave the field so it validates
  key: tab
  wait_after: 2
# THE PRESS IS RETRIED UNTIL THE NEXT PANE APPEARS, BECAUSE ONE PRESS SOMETIMES DOES NOT TAKE.
#
# MEASURED on the CI leg: the fallback point (1366, 811) was pressed, and the next reading was
#
#	screen: 141 word(s): Workspaces Applications M1117 9:04 PM ...
#
# - THE DESKTOP. The wizard had closed or the press had gone to the dock, and the steps after it
# typed a password into the wallpaper before the install step found the disk at 0 MiB.
#
# `at_button` WITH `at_fallback` PRESSES ONCE. This is a loop instead: press, then read the pane the
# press is supposed to reach, and press again if it is not there. The verdict is `Choose Account
# Password`, which is on the password pane and nowhere on the account-name pane before it.
- name: create user account, and wait for the password pane
  loop:
    max: 6
    do:
    - click:
      - 1366
      - 811
      wait_after: 8
    ocr:
      name: pw_pane
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 2
    check:
      name: there
      from: pw_pane
      mode: says_any
      # `Choose` IS ON THE DESKTOP - MEASURED, the run's own reading after the press was
      #
      #	pw_pane: 144 word(s): Workspaces Applications M1118 415 AM, uo om OO > lan ee, A ...
      #	check: there = true (read "Choose")
      #
      # - the DESKTOP, with `Choose` somewhere in it. The press had closed the installer (or gone to
      # the dock), and this check then said the password pane was up. Everything after it typed a
      # password into the wallpaper and pressed `Don't Encrypt` into the dock at (907, 1047).
      #
      # `Confirm Password` IS THE PANE'S OWN SECOND LABEL and the desktop does not carry it.
      words:
      - - Confirm
      - - Password
    until:
      fact: there

- name: dismiss anything a stray click opened
  key: esc
  wait_after: 2
# THE PASSWORD FIELDS ARE AT x=1195, AND `Next` STAYS GREY WHILE THE FIRST ONE IS EMPTY.
#
# MEASURED on the live page. The field spans x=970..1425, so 1350 IS inside it and the click was
# never "outside the box" - but the box only takes the caret when the press lands while the field
# has focus, and a press into the right third of this one did not. Clicking the field's own centre
# and typing was measured working:
#
#	click (1195,445) then type -> "•••••  ⚠ The password is shorter than 8 characters"
#
# `admin` IS SHORT AND THAT IS NOT A REFUSAL: the warning is drawn and `Next` turns GREEN anyway,
# exactly as `Password is too short` is a warning in kubuntu's Calamares. The confirm field is the
# same box 102 pixels lower: (1195, 547).
- name: type the password
  click:
  - 1195
  - 445
  type: '{{ password }}'
  type_gap: 0.09
  wait_after: 2
- name: confirm the password
  click:
  - 1195
  - 547
  type: '{{ password }}'
  type_gap: 0.09
  wait_after: 2
- name: account password next
  # THE ACCENT COLOUR OVER THE WHOLE WIZARD AREA, ABOVE THE DOCK.
  #
  # MEASURED: the eight presses on this medium shared one scan box, (1240,755)-(1430,845), which is
  # where THIS WORKSTATION draws the button. On the runner the installer's window is smaller and drawn
  # elsewhere - fedora's was 685x365 there against 730x400 here - so the box contained no fill at all
  # and the `at_fallback` point (1366, 811) landed outside the window: the run's own log shows the
  # press closing the installer and the next reading being `Workspaces Applications ...`, the desktop.
  #
  # THE BUTTON'S FILL IS rgb(144,207,176), MEASURED ON THE BUTTON ITSELF.
  #
  # MEASURED over the `Select` button's own box (x 1330..1400, y 795..830 of the language page):
  #   rgb(144,207,176) 1947 px  <- the fill
  #   rgb(166,217,192)   70 px  <- its antialiased edge
  #
  # `rgb(96,208,216)` CAME FROM A WHOLE-FRAME CENSUS and is the PROGRESS BAR and the window BORDER -
  # 9920 pixels of chrome. A census finds what there is most of; a button is what fills its own box.
  # The region still stops at y=980 so the dock, below it, is outside.
  at_color:
  - 144
  - 207
  - 176
  color_tolerance: 30
  # THE LOWER HALF OF THE WIZARD, NOT THE WHOLE FRAME.
  #
  # MEASURED: with the search over `y 0..980` the same colour found 1297 pixels across
  # `x568..1408 y238..826` - the ROBOT ILLUSTRATION on the language page, whose greens are within the
  # tolerance - and the centre it computed was (988, 532), nowhere near the button.
  # Restricted to `y 700..870, x 1200..1500` it finds 2476 pixels in `x1326..1408 y795..826`, centre
  # (1367, 810): the `Select` button exactly.
  color_region:
  - 1100
  - 700
  - 1920
  - 900
  at_fallback:
  wait_after: 25
# THE PRESS IS FOLLOWED BY A VERDICT, FOR THE SAME REASON AS EVERY OTHER BUTTON IN THIS TREE.
#
# MEASURED on the CI leg: (1081, 808) was pressed and the run then waited an hour for a disk that never
# moved. The pop installer's own progress page says `Extracting files` - measured by hand - so that is
# what proves the press took, and the encryption page's `Encrypt` button is what must be gone.
# THE PRESS IS BY COLOUR, FOR THE SAME REASON AS NIXOS AND FEDORA.
#
# MEASURED: (1081, 808) is where the pop installer draws `Don't Encrypt` on this workstation and the
# install starts. On the runner the press left the page unchanged for an hour.
#
# THE POP INSTALLER'S PRIMARY BUTTON IS ITS OWN TEAL, not Calamares' blue: measured over that button's
# box it is `rgb(26, 188, 156)` - the accent the installer uses for `Select`, `Next` and `Install`.
- name: drive encryption - don't encrypt
  at_color:
  - 26
  - 188
  - 156
  color_tolerance: 30
  # THE FOOTER ONLY: this installer's teal is also its dock's accent and appears in the wallpaper's
  # nebula, so a whole-frame search finds decoration. The buttons are in the bottom tenth.
  color_region:
  - 0
  - 700
  - 1920
  - 1080
  wait_after: 15

- name: the install has started
  loop:
    max: 20
    do:
    - wait: 6
    ocr:
      name: started
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: begun
      from: started
      mode: says_without
      words:
      - - Extracting
      without: [Encrypt]
    until:
      fact: begun
  wait_after: 35
- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
