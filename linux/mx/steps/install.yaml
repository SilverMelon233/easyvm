name: mx - the minstall walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - mx.iso
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: mx.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/xfce
  timeout: 5400
- name: desktop - installer
  settle: 28
  do:
  - click:
    - 81
    - 259
    settle: 3
  - click:
    - 81
    - 259
    settle: 3
- name: wait for the terms page
  loop:
    max: 30
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: says
      words:
      - terms
      - of
      - use
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: terms of use
  click:
  - 1482
  - 889
  settle: 14
- name: wait for the installation type page
  loop:
    max: 30
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: says
      words:
      - select
      - type
      - of
      - installation
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: installation type
  click:
  - 1482
  - 889
  settle: 16
- name: wait for the confirmation page
  loop:
    max: 30
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: says
      words:
      - final
      - review
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: installation confirmation - start
  click:
  - 1478
  - 889
  settle: 25
- name: dismiss the invalid settings modal if it is up
  click:
  - 1069
  - 583
  settle: 4
- name: wait for the swap file page
  loop:
    max: 40
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: says
      words:
      - create
      - a
      - swap
      - file
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: swap file
  click:
  - 1482
  - 889
  settle: 18
- name: wait for the computer identity page
  loop:
    max: 40
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: says
      words:
      - computer
      - identity
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: computer identity
  click:
  - 1482
  - 889
  settle: 18
- name: wait for the localization page
  loop:
    max: 40
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: says
      words:
      - localization
      - defaults
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: localization defaults
  click:
  - 1482
  - 889
  settle: 18
- name: wait for the account page
  loop:
    max: 30
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: says
      words:
      - default
      - user
      - login
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: account - login name
  click:
  - 1210
  - 342
  type: '{{ user }}'
  settle: 2
- name: account - password
  click:
  - 1210
  - 377
  type: '{{ password }}'
  settle: 2
- name: account - confirm password
  click:
  - 1210
  - 412
  type: '{{ password }}'
  settle: 3
- name: autologin
  click:
  - 700
  - 561
  settle: 4
- name: default user login
  click:
  - 1482
  - 889
  settle: 25
- name: the installer finishes
  loop:
    max: 90
    do:
    - click:
      - 420
      - 300
      settle: 20
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - congratulations
      - - completed
        - the
        - installation
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'