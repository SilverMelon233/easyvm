name: ubuntu - the subiquity walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - ubuntu.iso
- name: start recording
  record: ubuntu-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: ubuntu.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the installer window
  loop:
    max: 120
    do:
    - click:
      - 420
      - 300
      wait_after: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - to
        - ubuntu
      - - choose
        - your
        - language
    until:
      fact: done
- name: welcome / language
  click:
  - 1355
  - 848
  wait_after: 12
- name: accessibility
  click:
  - 1355
  - 848
  wait_after: 12
- name: keyboard layout
  click:
  - 1355
  - 848
  wait_after: 12
- name: internet connection
  click:
  - 1355
  - 848
  wait_after: 14
- name: the update question
  click:
  - 1355
  - 848
  wait_after: 14
- name: type of installation
  click:
  - 1355
  - 848
  wait_after: 14
- name: applications
  click:
  - 1355
  - 848
  wait_after: 14
- name: optimise your computer
  click:
  - 1355
  - 848
  wait_after: 14
- name: disk setup
  click:
  - 1355
  - 848
  wait_after: 20
- name: encryption
  click:
  - 1355
  - 848
  wait_after: 14
- name: create your account - full name
  click:
  - 1139
  - 393
  type: '{{ user }}'
  clear: true
  wait_after: 2
- name: create your account - username
  click:
  - 1139
  - 501
  type: '{{ user }}'
  clear: true
  wait_after: 2
- name: create your account - password
  click:
  - 1050
  - 563
  type: '{{ password }}'
  clear: true
  wait_after: 2
- name: create your account - confirm password
  click:
  - 1139
  - 616
  type: '{{ password }}'
  clear: true
  wait_after: 3
- name: clear 'require my password to log in'
  click:
  - 923
  - 670
  wait_after: 3
- name: create your account
  click:
  - 1355
  - 848
  wait_after: 12
- name: time zone - new york on the map
  click:
  - 762
  - 483
  wait_after: 4
- name: time zone
  click:
  - 1355
  - 848
  wait_after: 14
- name: ready to install - the green install button
  click:
  - 1355
  - 848
  wait_after: 30
- name: the installer finishes
  loop:
    max: 270
    do:
    - click:
      - 420
      - 300
      wait_after: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - installed
        - and
        - ready
        - to
        - use
      - - restart
        - to
        - complete
        - the
        - installation
      - - restart
        - now
    until:
      fact: done
- name: give the installer its last few seconds, because "ready to use" is not "flushed"
  # THE DISK THIS STAGE PUBLISHED HAD NO PARTITION TABLE: `qemu-img dd` of its first 8 MiB read
  # all-zero, and the next stage's UEFI went to its shell instead of the system.
  #
  # THE INSTALLER SAID "installed and ready to use" AND THE MACHINE WAS KILLED ONE STEP LATER. Ubiquity
  # writes the ESP and the partition table as its LAST act, and `kill` takes the machine down without
  # an unmount - so the writes that make the disk bootable are the ones that had not reached the
  # medium.
  #
  # SO THE KILL WAITS. `acpi` WOULD BE BETTER AND IS NOT AVAILABLE HERE: a LIVE INSTALLER ignores the
  # power button - nothing in it handles the ACPI event - so an `acpi:` step waits out its whole
  # timeout on a machine that was never going to stop, and the kill happens anyway. That is what
  # TestAnInstallStopsTheMachineBeforePublishingTheDisk says, and it is right.
  #
  # WHAT A KILL CANNOT DO IS GIVE THE INSTALLER TIME, and a `wait:` before the kill can. Twenty
  # seconds is not a guess about the copy - the copy is reported done - it is time for the LAST writes
  # (the ESP, the partition table, the GPT backup) to leave the page cache.
  wait: 20
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
