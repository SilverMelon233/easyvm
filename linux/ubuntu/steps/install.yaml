name: ubuntu - the subiquity walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - ubuntu.iso
- name: start recording
  record: ubuntu-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: ubuntu.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the installer window
  loop:
    max: 120
    do:
    - click:
      - 420
      - 300
      wait_after: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - to
        - ubuntu
      - - choose
        - your
        - language
    until:
      fact: done
- name: welcome / language
  click:
  - 1355
  - 848
  wait_after: 12
- name: wait for the accessibility page, because a click that assumes the page before it is a click that
    can miss
  # EVERY PAGE BELOW IS REACHED BY WAITING FOR ITS OWN HEADING FIRST. The walk used to click
  # `Next` at (1355, 848) once per page with a fixed `wait_after:` and never look. MEASURED on run
  # 43950603441: one page was not ready when its click arrived, every click after it landed one page
  # early, and the walk typed the account fields into the ENCRYPTION page - which has no fields - then
  # clicked its way to a summary that was never reached. The reading stayed on
  #
  #	Encryption and file system
  #
  # for SEVENTY-TWO MINUTES, and the stage published a disk with no partition table, because the
  # installer never left that page.
  #
  # THE SCREENSHOTS ARE THE PROOF OF WHERE THE BUTTONS ARE: on the disk-setup and encryption pages in
  # that run's own recording, `Next` is the light rectangle at (1355, 848) and it is ENABLED. The
  # coordinates were right; the assumption that each click arrives on the page the previous one opened
  # was wrong.
  #
  # SO EACH PAGE IS AWAITED BY ITS OWN WORDS and the click follows the reading. A page that never
  # appears now fails HERE, naming the heading that was expected, instead of forty screens later.
  loop:
    max: 24
    do:
    - wait: 5
    ocr:
      name: page
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: there
      from: page
      mode: says_any
      words:
      - - accessibility
    until:
      fact: there
- name: accessibility
  click:
  - 1355
  - 848
  wait_after: 12
