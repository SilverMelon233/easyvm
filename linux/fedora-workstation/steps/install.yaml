name: fedora-workstation - anaconda and the first boot
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - fedora-workstation.iso
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: fedora-workstation.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
- name: wait for the anaconda window
  loop:
    max: 60
    do:
    - click:
      - 420
      - 300
      settle: 5
    see:
      of: [text]
      name: screen
      rect:
      - 0
      - 0
      - 1920
      - 1080
      rect_at:
      - 1920
      - 1080
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - installation
        - method
      - - installation
        - summary
      - - let's
        - install
    until:
      fact: done
- name: install fedora linux
  settle: 3
  do:
  - click:
    - 838
    - 708
    settle: 3
  - click:
    - 838
    - 708
    settle: 3
- name: install fedora linux (again, if anaconda is not up)
  when_not:
  - installation
  - method
  settle: 25
  do:
  - click:
    - 838
    - 708
    settle: 3
  - click:
    - 838
    - 708
    settle: 3
- name: install fedora linux (and once more)
  when_not:
  - installation
  - method
  settle: 30
  do:
  - click:
    - 838
    - 708
    settle: 3
  - click:
    - 838
    - 708
    settle: 3
- name: anaconda is up
  loop:
    max: 30
    do:
    - click:
      - 420
      - 300
      settle: 10
    see:
      of: [text]
      name: screen
      rect:
      - 0
      - 0
      - 1920
      - 1080
      rect_at:
      - 1920
      - 1080
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - installation
        - method
      - - let's
        - install
    until:
      fact: done
- name: welcome
  click:
  - 729
  - 1002
  settle: 15
- name: welcome - what is on screen
  see:
    of: [text]
    name: welcome
    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
    wait: 0
- name: welcome - the screen says so
  check:
    name: asserted
    from: welcome
    mode: says_any
    words:
    - [installation, method]
- name: installation method
  click:
  - 729
  - 1002
  settle: 12
- name: installation method - what is on screen
  see:
    of: [text]
    name: installation_method
    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
    wait: 0
- name: installation method - the screen says so
  check:
    name: asserted
    from: installation_method
    mode: says_any
    words:
    - [storage, configuration]
    - [configuracion, de, almacenamiento]
- name: storage configuration
  click:
  - 729
  - 1002
  settle: 12
- name: storage configuration - what is on screen
  see:
    of: [text]
    name: storage_configuration
    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
    wait: 0
- name: storage configuration - the screen says so
  check:
    name: asserted
    from: storage_configuration
    mode: says_any
    words:
    - [review, and, install]
    - [revisar, e, instalar]
- name: erase data and install
  click:
  - 780
  - 1002
  settle: 20
- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
- name: exit to the live desktop
  click:
  - 963
  - 364
  settle: 10
- name: first boot
  loop:
    max: 90
    do:
    - settle: 10
    see:
      of: [text]
      name: screen
      rect:
      - 0
      - 0
      - 1920
      - 1080
      rect_at:
      - 1920
      - 1080
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - to
        - fedora
      - - type
        - to
        - search
      - - start
        - using
        - fedora
    until:
      fact: done
- name: language - search for the United States
  click:
  - 960
  - 492
  type: united states
  settle: 5
- name: language - pick English (United States)
  click:
  - 960
  - 550
  settle: 6
- name: language
  click:
  - 1432
  - 181
  settle: 10
- name: typing
  click:
  - 1432
  - 181
  settle: 10
- name: location services off
  click:
  - 1209
  - 485
  settle: 2
- name: automatic problem reporting off
  click:
  - 1209
  - 601
  settle: 2
- name: privacy
  click:
  - 1432
  - 181
  settle: 10
- name: time zone
  click:
  - 1432
  - 181
  settle: 12
- name: third party repositories
  click:
  - 1432
  - 181
  settle: 10
- name: about you - full name
  click:
  - 1000
  - 528
  type: '{{ user }}'
  settle: 2
- name: about you - full name - what is on screen
  see:
    of: [text]
    name: about_you_full_name
    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
    wait: 0
- name: about you - full name - the screen says so
  check:
    name: asserted
    from: about_you_full_name
    mode: says
    words:
    - '{{ user }}'
- name: about you
  click:
  - 1432
  - 181
  settle: 10
- name: password - password
  click:
  - 960
  - 493
  type: '{{ password }}'
  settle: 2
- name: password - confirm
  click:
  - 960
  - 630
  type: '{{ password }}'
  settle: 3
- name: password
  click:
  - 1432
  - 181
  settle: 20
- name: start using fedora linux
  click:
  - 959
  - 709
  settle: 25
- name: skip the tour
  click:
  - 852
  - 756
  settle: 12
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'