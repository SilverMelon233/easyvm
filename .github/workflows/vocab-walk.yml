name: vocab walkthroughs

# THE BRANCH'S OWN GUEST RUN, ON THE BRANCH'S OWN IMAGE.
#
# `vocab-image.yml` builds `:vocab-<branch>` and runs the unit tests in it. THIS runs REAL
# WALKTHROUGHS in that image, which is the only thing that can prove a vocabulary change is more than
# a parse: a step that loads, validates, and then does nothing is exactly the failure
# `internal/step`'s own comment warns about.
#
# IT INSTALLS AND STOPS THERE. The `ssh` and `vm-configure` stages are the OS workflows' business,
# and this branch changes nothing about the network or the guest account - so a failure in them would
# be somebody else's, and a run that mixes two subjects cannot say which broke.
#
# TWO LEGS AND THEY ARE CHOSEN FOR WHAT THEY EXERCISE, not at random:
#
#	kubuntu  Calamares: the wizard whose Next sits at a DIFFERENT HEIGHT on every page, and the
#	         one whose install leg has passed CI most often - so a failure here is this branch.
#	ubuntu   the Flutter installer: a completely different wizard, and the leg that already has a
#	         green run on `main` (`43982692185`), which makes it the control for "did this branch
#	         change how a file is parsed".
#
# `concurrency` IS PER RUN AND THE GROUP NAMES THE BRANCH, so pushing again cancels this branch's own
# run rather than anybody else's.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["vocab image"]
    types: [completed]
    branches:
      - "vocabulary/**"

concurrency:
  group: vocab-walk-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  walk:
    # ONLY WHEN THE IMAGE WAS BUILT, because a walkthrough cannot start before its image exists.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: vocab
      image_tag: vocab-vocabulary-three-verbs
      stages: |
        [
          {
            "name": "vocab-kubuntu-install",
            "file": "linux/kubuntu/steps/install.yaml",
            "pull": "",
            "assets": ["iso-kubuntu-desktop:kubuntu.iso"],
            "out": "vocab-kubuntu.qcow2",
            "publish": "vocab-kubuntu",
            "timeout": 100
          },
          {
            "name": "vocab-ubuntu-install",
            "file": "linux/ubuntu/steps/install.yaml",
            "pull": "",
            "assets": ["iso-ubuntu-desktop:ubuntu.iso"],
            "out": "vocab-ubuntu.qcow2",
            "publish": "vocab-ubuntu",
            "timeout": 100
          }
        ]
