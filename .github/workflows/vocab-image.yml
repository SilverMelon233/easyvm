name: vocab image

# A BRANCH-SCOPED IMAGE, SO A VOCABULARY CHANGE CAN BE DRIVEN BY REAL GUESTS WITHOUT TOUCHING `latest`.
#
# `image.yml` publishes `ghcr.io/<repo>:latest`, and `stage.yml` runs every walkthrough inside that
# one image. A change under `internal/` therefore cannot be tested by a stage until it is IN `latest`
# - and building `latest` from a branch would hand every other session's CI this branch's binary.
#
# SO THIS BUILDS THE SAME CONTAINERFILE UNDER ITS OWN TAG. It is deliberately a copy of the build
# half of `image.yml` rather than a call to it, because the two answer different questions:
#
#	image.yml    is `main` ready to be what everyone runs?      -> :latest
#	this         do the vocabulary changes work against a guest? -> :vocab-<branch>
#
# THE TAG IS THE BRANCH NAME, so two branches cannot overwrite each other and the tag says where the
# binary came from when a log is read.
#
# `concurrency` IS PER BRANCH here, unlike `image.yml`'s single `image` group: these builds are not
# competing to be the one truth, so cancelling across branches would lose a result somebody wants.

on:
  workflow_dispatch:
  push:
    branches:
      - "vocabulary/**"
    paths:
      - "Containerfile"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/vocab-image.yml"

concurrency:
  group: vocab-image-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # THE WHOLE POINT OF THE BRANCH: if the code does not build and its own tests do not pass,
      # there is nothing to put in an image.
      - name: the binary builds
        run: go build ./...

      - name: vet
        run: go vet ./...

      # THE TESTS THAT DECIDE THE DESIGN, named so their failure is unambiguous in the log. They
      # are also run by the full `go test` below; naming them first means a design regression is
      # read as one rather than as "some test failed".
      - name: the vocabulary tables match the code
        run: go test ./internal/step/ -run 'TestEveryKey|TestNoKey|TestMerged' -v -count=1

      - name: the measurements reproduce the desktop verdicts
        run: go test ./internal/screen/ -run 'TestTheMeasurementsReproduce' -v -count=1

      - name: fuzzy matches single glyphs and refuses the opposite word
        run: go test ./internal/run/ -run 'TestTheThree|TestFuzzy|TestARatio|TestNormalisation' -v -count=1

      - name: every walkthrough still loads
        run: |
          set -e
          go build -o /tmp/easyvm ./cmd/easyvm
          n=0
          for f in $(find . -path ./.git -prune -o -name '*.yaml' -path '*/steps/*' -print); do
            /tmp/easyvm check "$f" >/dev/null
            n=$((n+1))
          done
          echo "$n walkthrough(s) load"

      - name: the whole test suite
        run: go test ./... -count=1

  publish:
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # ONE TAG AND IT IS THE BRANCH. No `latest`, no sha: a branch image is identified by the
          # branch it came from, and a reader of a log can go straight to it.
          tags: |
            type=raw,value=vocab-${{ github.ref_name }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the branch image runs, and its binary does
        run: |
          set -e
          tag="${{ env.IMAGE }}:vocab-${{ github.ref_name }}"
          # A PULL RATHER THAN A LOCAL LOAD, because that is how a run uses it - an image that
          # cannot be pulled is an image no stage can start.
          docker pull "$tag"
          docker run --rm --entrypoint "" "$tag" easyvm versions
