name: egress-e2e

# DOES EACH CONNECTION TAKE THE PATH THE EGRESS RULES CHOSE?
#
# ---------------------------------------------------------------------------------------------------
# THE QUESTION THIS JOB EXISTS FOR, AND WHY IT NEEDS A REAL PROXY
#
# `block` is easy to assert: the guest gets nothing back. `direct` and `proxy:NAME` both SUCCEED, so a
# passing check proves nothing about which path was taken. The only way to tell them apart from outside
# is to have each upstream record what it carried - and then assert on the RECORD rather than on the
# response.
#
# SO THERE ARE TWO 3PROXY CONTAINERS, `primary` and `backup`, each logging every request with its
# destination. The rules name one of them, and the assertion is:
#
#	proxy:primary   the destination appears in primary's log, and NOT in backup's
#	proxy:backup    the reverse
#	direct          it appears in NEITHER log
#	block           nothing arrives at all
#
# THAT IS A STRONGER CLAIM THAN A MARKER IN THE RESPONSE. A marker proves the guest received something;
# the log proves WHICH UPSTREAM CARRIED IT - and the "appears in neither" case is what makes `direct`
# checkable at all, since a direct connection leaves no trace in a proxy by definition.
#
# ---------------------------------------------------------------------------------------------------
# WHY 3PROXY AND NOT mihomo
#
# mihomo's value is a rule engine and subscription handling. Both would be a second implementation of
# what is being tested, and its config is far larger than the thing under test. 3proxy is an HTTP
# CONNECT server, a SOCKS5 server and a log - which is exactly the surface needed. MEASURED on its
# README: "SOCKSv5 UDP and BIND support" is documented, which matters because the UDP half of the relay
# speaks SOCKS5 UDP ASSOCIATE and HTTP CONNECT cannot carry a datagram.
#
# ---------------------------------------------------------------------------------------------------
# WHAT RUNS, IN ORDER
#
#	build the daemon, the tester image, and the alpine root filesystem
#	start primary and backup 3proxy, each on its own port pair (8080 CONNECT, 1080 SOCKS)
#	start the daemon with the guest's TCP proxy pointing at primary and UDP at primary's SOCKS
#	boot an alpine microvm and wait for ssh
#	apply a policy that uses all four outcomes
#	make requests FROM THE GUEST and assert against the proxies' logs
#
# THE GUEST IS DRIVEN THROUGH `/api/exec`, NOT `/api/shell`: the shell requests a pty, which echoes the
# command it is sent, and every attempt to read a result from that stream was a guess about how much
# noise to strip. `/api/exec` returns stdout, stderr and an exit status.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: egress-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  ALPINE_VERSION: "3.21"
  # THE TWO UPSTREAM NAMES THE TEST USES, so a failure message can say which one was expected.
  PRIMARY_PORT: "18090"
  BACKUP_PORT: "18091"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # THE JOB RUNS ON THE HOST AND STARTS THE DAEMON DIRECTLY, NOT IN A NESTED CONTAINER.
    #
    # TWO MEASUREMENTS DECIDED THIS, AND THE FIRST ONE WAS WRONG TWICE:
    #
    #   the device exists. `sandbox.yml`, `stage.yml` and `vocab-image.yml` all pass `--device /dev/kvm`
    #   unconditionally, and a one-minute probe confirmed it:
    #
    #	host:      crw-rw---- root:kvm   10, 232  /dev/kvm
    #	in a job:  --device /dev/kvm  ->  crw-rw---- root 991  /dev/kvm
    #
    #   an EARLIER VERSION OF THIS FILE PROBED WITH `[ -e /dev/kvm ] && [ -r /dev/kvm ]` and the
    #   device is `crw-rw---- root:kvm` - so `-r` is false for any user outside the `kvm` group, and
    #   the stricter test silently chose TCG on a runner that has hardware acceleration.
    #
    #   `container:` CANNOT WORK HERE. MEASURED with `image: ghcr.io/${{ github.repository }}:latest`:
    #
    #	invalid reference format: repository name (SilverMelon233/easyvm) must be lowercase
    #
    #   and the job died in `Initialize containers` before its first step. There is no `lower()` in a
    #   GitHub expression, and hard-coding an image name would make this depend on a package a fork may
    #   not have pushed.
    #
    # SO `docker run --device /dev/kvm` FROM THE HOST IS THE SHAPE, and the host has the device. The
    # probe that made it look absent was asking the wrong question.
    permissions:
      contents: read
      packages: read
      # THE ROOTFS IS PUSHED BY `microvm-rootfs.yml`, so this job only pulls. `read` is enough, and
      # naming it is what keeps a fork's run from asking for write it cannot have.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # THE ROOT FILESYSTEM IS DOWNLOADED, NOT BUILT - see `microvm-rootfs.yml`, which publishes it.
      # This job used to run the build script itself, ten minutes of work that another workflow had
      # already done from the same script.
      # `qemu-img` IS HOW A GUEST STARTS: every boot runs on a qcow2 OVERLAY over the base disk, so
      # the base is never written. MEASURED without it:
      #
      #	boot: could not create an overlay over alpine.qcow2: qemu-img is not installed:
      #	      exec: "qemu-img": executable file not found in $PATH
      #
      # AND IT MUST BE ON ROOT'S PATH, because the daemon runs under `sudo`.
      - name: the host tools the daemon calls by name
        run: |
          set -eux
          sudo apt-get update
          # DNSMASQ IS THE GUEST'S DHCP SERVER - not its resolver any more, which this repository
          # answers itself, but the thing that hands out the lease. MEASURED without it:
          #
          #	boot: dnsmasq: exec: "dnsmasq": executable file not found in $PATH
          # THE TOOLS THE DAEMON CALLS BY NAME, ALL OF THEM, because each one has been a separate
          # failure: `qemu-img` for the overlay, `dnsmasq` for the lease, `ip` and `iptables` for the
          # bridge. A missing one is `exec: not found` from inside a boot, which reads as a boot
          # failure.
          #
          # `iproute2` AND `iptables` ARE ALREADY ON THE RUNNER IMAGE and are listed anyway: they are
          # what the daemon shells out to for the bridge and the NAT rules, and a runner image is not a
          # contract.
          sudo apt-get install -y --no-install-recommends \
            qemu-utils qemu-system-x86 e2fsprogs dnsmasq iproute2 iptables
          qemu-img --version | head -1
          qemu-system-x86_64 --version | head -1
          dnsmasq --version | head -1
          ip -V | head -1
          iptables --version
          sudo -E env PATH="$PATH" qemu-img --version | head -1

      - name: the alpine root filesystem
        id: rootfs
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: rootfs-alpine
          repository: ${{ github.repository }}
          dest: /tmp/alpine-out
          path: rootfs-alpine.tar
          token: ${{ github.token }}

      # THE PULL WRITES TO THE WORKSPACE, NOT TO `dest`.
      #
      # MEASURED, with `dest: /tmp/alpine-out`:
      #
      #	--- what the pull left behind ---
      #	/tmp/alpine-out                                          <- empty
      #	/home/runner/work/easyvm/easyvm/rootfs-alpine.tar         <- the file
      #
      # `oci-pull` reports `rootfs-alpine.tar complete (91678720 bytes)` and puts it at the repository
      # root, so both the action's `path` output and its `dest` input were misleading here. The
      # artifact is named from the workspace, which is where it actually lands.
      - name: unpack the three files
        run: |
          set -eux
          mkdir -p /tmp/alpine-out
          tar -xf "$GITHUB_WORKSPACE/rootfs-alpine.tar" -C /tmp/alpine-out
          rm -f "$GITHUB_WORKSPACE/rootfs-alpine.tar"
          ls -l /tmp/alpine-out

      # THE CONTAINERFILE COPYs `dist/easyvm` RATHER THAN COMPILING IT, so the binary is produced here
      # the same way the release workflow produces it.
      - name: build the daemon and the testing image
        run: |
          set -eux
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/easyvm ./cmd/easyvm
          docker build -f Containerfile --target tester -t easyvm-ci:local .

      # -------- the two upstreams --------
      #
      # A PROXY PER NAME, EACH LOGGING WHAT IT CARRIED. `ci/proxy-log.py` is forty lines of standard
      # library rather than a package, because this job already runs inside the project's container -
      # that is what makes `/dev/kvm` available - so a second container cannot be started, and
      # installing 3proxy on every run would depend on a Debian archive being reachable.
      #
      # BOTH LISTEN ON `0.0.0.0`, SO THE GUEST CAN REACH THEM. The guest's route out is the daemon's
      # bridge (`172.30.0.1`), so a proxy bound to loopback would be invisible to it - MEASURED as
      # `Connection reset by peer` in an earlier attempt at this test.
      - name: start the two upstream proxies
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/logs"
          python3 ci/proxy-log.py --connect-port "$PRIMARY_PORT" \
            --socks-port "$((PRIMARY_PORT+1000))" \
            --log "$RUNNER_TEMP/logs/primary.log" \
            > "$RUNNER_TEMP/logs/primary.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/logs/primary.pid"

          python3 ci/proxy-log.py --connect-port "$BACKUP_PORT" \
            --socks-port "$((BACKUP_PORT+1000))" \
            --log "$RUNNER_TEMP/logs/backup.log" \
            > "$RUNNER_TEMP/logs/backup.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/logs/backup.pid"

          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/$PRIMARY_PORT) 2>/dev/null &&
               (exec 3<>/dev/tcp/127.0.0.1/$BACKUP_PORT) 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/logs/primary.out" "$RUNNER_TEMP/logs/backup.out"

      # -------- the daemon and its guest --------
      #
      # THE DAEMON RUNS ON THE RUNNER HOST, LIKE `stage.yml` RUNS IT. No container wrapper: the job
      # needs `/dev/kvm` (present on the host) and `/dev/net/tun` (present), and `sandbox.yml`'s own
      # comment names the three devices a guest needs. `easyvm serve` opens them itself.
      #
      # `EASYVM_HTTP` IS SET FOR THE CLIENTS BELOW, because `client.Dial(work)` reads that variable and
      # ignores its `work` argument - MEASURED as `connection refused` on :8080 while the daemon was on
      # :8081.
      - name: start the daemon
        run: |
          set -eux
          work="$RUNNER_TEMP/work"
          mkdir -p "$work"
          # THE DAEMON RUNS AS ROOT AND THE REST OF THE JOB DOES NOT, so the directory has to be
          # writable by both: the daemon creates its socket, its overlay and its console log in here,
          # and every step below reads them.
          chmod 777 "$work"
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "EASYVM_HTTP=127.0.0.1:8081" >> "$GITHUB_ENV"

          cp /tmp/alpine-out/alpine-vmlinuz /tmp/alpine-out/alpine-initramfs \
             /tmp/alpine-out/alpine.qcow2 "$work"/

          # BOTH PROXY VARIABLES POINT AT `primary`. The rules then move individual destinations to
          # `backup` or to `direct`, which is the thing under test - a policy that started elsewhere
          # would prove less.
          # SUDO, BECAUSE THE DAEMON BUILDS A BRIDGE, A TAP AND IPTABLES RULES.
          #
          # MEASURED: `easyvm serve` on a runner wrote NOTHING to its log and never printed
          # `listening on` - `net.Up` runs `ip link add ... type bridge`, `iptables -t nat -N` and a
          # `/proc/sys` write, and an unprivileged user gets EPERM on the first of them. `stage.yml`
          # and `sandbox.yml` never hit this because their daemon runs INSIDE a container that declares
          # `--cap-add NET_ADMIN`; this job runs on the host, so it needs the privilege instead of a
          # capability.
          #
          # THE CHILD PROCESS IS ROOT AND THE JOB IS NOT, which is the point: everything else here
          # (the proxies, the assertions, the tar) stays unprivileged.
          #
          # THE BINARY IS NAMED BY PATH, BECAUSE `sudo` RESETS PATH. MEASURED: `sudo -E env ... easyvm
          # serve` produced an EMPTY log for sixty seconds - `sudo` had a secure_path without the
          # directory the step had built into, so the command was never found and the failure went to a
          # stream nobody was reading.
          sudo -E env \
            EASYVM_TRANSPARENT_PROXY="127.0.0.1:$PRIMARY_PORT" \
            EASYVM_UDP_PROXY="127.0.0.1:$((PRIMARY_PORT+1000))" \
            EASYVM_EGRESS_RULES=1 \
            "$PWD/dist/easyvm" serve --work "$work" --http :8081 \
            > "$work/daemon.log" 2>&1 &
          echo $! > "$work/daemon.pid"

          for i in $(seq 1 60); do
            case "$(cat "$work/daemon.log" 2>/dev/null || true)" in
              *"listening on"*) break ;;
            esac
            sleep 1
          done
          cat "$work/daemon.log"
          curl -fsS --max-time 5 http://127.0.0.1:8081/healthz
          echo

      # THE ALPINE WALKTHROUGH, WHICH ALSO PROVES THE MACHINE BOOTS. `create` rather than `run` because
      # the machine has to stay up for the requests below.
      - name: boot the alpine microvm
        run: |
          set -eux
          cp linux/alpine-microvm/steps/console.walk "$WORK/console.walk"
          ls -l "$WORK"

          # `EASYVM_HTTP` COMES FROM THE ENVIRONMENT set by the step above, and it is not optional:
          # `client.Dial(work)` reads that variable and never looks at its `work` argument, so an unset
          # one means :8080 regardless of where the daemon is.
          echo "--- create ---"
          "$PWD/dist/easyvm" create "$WORK/console.walk" --work "$WORK"

          # THE GUEST GETS A REAL BUDGET. Under KVM an alpine microvm reaches ssh in seconds; the loop
          # is generous because a runner without `/dev/kvm` falls back to TCG, where the same boot is
          # minutes. Either way the failure that matters is "sshd never answered", and the state below
          # says which phase it reached.
          for i in $(seq 1 120); do
            st=$(curl -s --max-time 5 http://127.0.0.1:8081/api/state || true)
            case "$st" in *'"ssh_ready":true'*) break ;; esac
            sleep 2
          done
          curl -s http://127.0.0.1:8081/api/state | head -c 600; echo

      # -------- the rules --------
      #
      # FOUR OUTCOMES, ONE POLICY. `default block` is deliberate: an unmatched destination must be
      # refused, which is the half that catches a rule engine silently allowing what it did not
      # understand.
      #
      # THE DESTINATION ADDRESSES ARE LITERALS. A name would make the assertion depend on a resolver,
      # and the rule here is about the PATH rather than about DNS - name rules have their own unit
      # tests and their own measured behaviour.
      - name: apply a policy with all four outcomes
        run: |
          set -eux
          python3 ci/apply-policy.py "$PRIMARY_PORT" "$BACKUP_PORT"

      # THE REQUESTS COME FROM INSIDE THE GUEST, because that is what makes the rules apply: the table
      # is consulted when a connection crosses this pod's proxy, and a curl run on the pod would never
      # touch it.
      #
      # 203.0.113.0/24 IS TEST-NET-3 (RFC 5737), reserved for documentation and guaranteed not to be a
      # real destination - so a connection to it cannot accidentally succeed through some other route.
      - name: make the requests, from inside the guest
        run: |
          set -eux
          python3 ci/guest-curl.py http://127.0.0.1:8081 203.0.113.10
          python3 ci/guest-curl.py http://127.0.0.1:8081 203.0.113.20
          python3 ci/guest-curl.py http://127.0.0.1:8081 203.0.113.30
          python3 ci/guest-curl.py http://127.0.0.1:8081 203.0.113.40

      # -------- the assertions, on what the proxies CARRIED --------
      #
      # THE LOG IS THE EVIDENCE. A `direct` connection cannot appear in either log, which is the only
      # way to prove it did not go through a proxy - a response alone says nothing, because a proxied
      # connection also gets one.
      - name: the paths the rules chose
        run: |
          set -eux
          P_LOG="$RUNNER_TEMP/logs/primary.log"
          B_LOG="$RUNNER_TEMP/logs/backup.log"
          echo "=== primary carried ==="; cat "$P_LOG" 2>/dev/null || echo "(empty)"
          echo "=== backup carried ===";  cat "$B_LOG" 2>/dev/null || echo "(empty)"

          P=$(cat "$P_LOG" 2>/dev/null || true)
          B=$(cat "$B_LOG" 2>/dev/null || true)

          fail() { echo "::error::$*"; exit 1; }

          # `if` RATHER THAN `grep && fail`, BECAUSE `set -e` TREATS A FAILED `grep` AS FATAL. Written
          # the short way, the FIRST assertion would kill the step when it did not match - which is the
          # opposite of what it should do, and would report a passing test as a crash.
          echo "$P" | grep -q '203\.0\.113\.10' \
            || fail "proxy:primary did not carry 203.0.113.10 - primary's log has no such line"
          echo "$B" | grep -q '203\.0\.113\.20' \
            || fail "proxy:backup did not carry 203.0.113.20 - backup's log has no such line"

          # AND THE CROSS-CHECK, WHICH IS THE HALF THAT PROVES THE RULE DECIDED. Without it, a bug that
          # sent everything to primary would satisfy the first assertion.
          if echo "$B" | grep -q '203\.0\.113\.10'; then
            fail "203.0.113.10 was carried by BACKUP as well as primary"
          fi
          if echo "$P" | grep -q '203\.0\.113\.20'; then
            fail "203.0.113.20 was carried by PRIMARY as well as backup"
          fi

          # DIRECT LEAVES NO TRACE, BY DEFINITION: a direct connection does not touch a proxy, so its
          # ABSENCE from both logs is the evidence that it went direct rather than through one.
          if echo "$P$B" | grep -q '203\.0\.113\.30'; then
            fail "a direct destination appears in a proxy log"
          fi

          # THE BLOCKED DESTINATION REACHED NOBODY.
          if echo "$P$B" | grep -q '203\.0\.113\.40'; then
            fail "a blocked destination reached a proxy"
          fi

          echo "all four outcomes took the path the rules chose"

      - name: always, the logs
        if: always()
        run: |
          echo "=== daemon ==="; tail -40 "$RUNNER_TEMP/work/daemon.log" 2>/dev/null || true
          echo "=== primary proxy ==="; cat "$RUNNER_TEMP/logs/primary.out" 2>/dev/null | tail -20 || true
          echo "=== backup proxy ===";  cat "$RUNNER_TEMP/logs/backup.out" 2>/dev/null | tail -20 || true
          echo "=== primary carried ==="; cat "$RUNNER_TEMP/logs/primary.log" 2>/dev/null | tail -20 || true
          echo "=== backup carried ===";  cat "$RUNNER_TEMP/logs/backup.log" 2>/dev/null | tail -20 || true

      - name: summary
        if: always()
        run: |
          echo "### egress e2e" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Two 3proxy upstreams, one alpine microvm, four rules." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| rule | assertion |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`proxy:primary\` | 203.0.113.10 appears in primary's log and NOT backup's |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`proxy:backup\` | 203.0.113.20 appears in backup's log and NOT primary's |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`direct\` | 203.0.113.30 appears in NEITHER log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`default block\` | 203.0.113.40 reaches neither log |" >> "$GITHUB_STEP_SUMMARY"

      - name: clean up
        if: always()
        run: |
          set +e
          "$PWD/dist/easyvm" destroy --work "${WORK:-/nonexistent}" 2>/dev/null
          kill "$(cat "$RUNNER_TEMP/logs/primary.pid" 2>/dev/null)" 2>/dev/null
          kill "$(cat "$RUNNER_TEMP/logs/backup.pid" 2>/dev/null)" 2>/dev/null
          exit 0
