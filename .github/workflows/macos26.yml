name: macos26

# MACOS 26 (TAHOE), AS A CHAIN THAT TODAY HAS ONE STAGE.
#
# THIS FILE EXISTS BECAUSE 26 HAD NO ENTRY POINT AT ALL. `macos/26/steps/` held one file - `resume.yaml`,
# which boots a disk that already exists - so nothing ever INSTALLED 26, and the firmware this
# repository publishes for it (`macos-asset-*-26`) had no consumer. The setup stage below is that
# consumer, and it is the only stage: 26 has no `ssh` or `vm-configure` walkthrough yet.
#
# WHY A SEPARATE FILE RATHER THAN A ROW IN macos.yml. The two releases pull DIFFERENT ASSETS - a
# different recovery image and a different firmware, with different identities baked into it - and a
# matrix that chose between them would put the choice in a variable instead of in the file a reader
# opens. `macos.yml` is the 15 chain and this is the 26 chain; the day 26 grows an ssh stage it gets a
# job here, not a condition there.
#
# `from_tag` IS ABSENT ON PURPOSE. There is nothing to start from yet: this file's only stage is the
# one that CREATES the disk.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the assets"
        default: "easydev-org/easyvm"

concurrency:
  group: macos26
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  # THE GUEST ASKS FOR 16 GiB AND THE STANDARD RUNNER HAS 16 GB, SO qemu IS KILLED BY THE OOM KILLER
  # THREE MINUTES INTO THE COPY.
  #
  # MEASURED ON RUN 44122437321: the erase and the licence sheet passed, the destination card was
  # selected, "the copy runs, look 1" began, and at its tenth attempt the QMP connection became
  # `write: broken pipe` and every later attempt said the same. The daemon logged no error, the qemu
  # console had nothing after `HANDOFF TO XNU`, and the machine was still "up" - which is what an OOM
  # kill looks like from inside the process that survives it. The same walk had already produced a
  # working disk on a pod with a 24 GiB limit.
  #
  # A GUEST THIS SIZE NEEDS A LARGER RUNNER. GitHub's standard `ubuntu-24.04` has 4 vCPU / 16 GB; the
  # pod this walk was measured on has 12 vCPU / 24 GiB. So this job fails in the first minute, naming
  # the two numbers, instead of spending twenty minutes installing and then dying with a broken pipe
  # that points at screendump.
  #
  # IT IS A SEPARATE JOB SO THE MESSAGE IS THE WHOLE JOB. A check inside `setup` would be one step of
  # forty and would read as "prepare failed".
  room:
    runs-on: ubuntu-24.04
    steps:
      - name: the guest's memory has to fit in the runner's
        run: |
          set -eu
          need_gib=16
          total_kib=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
          total_gib=$(( total_kib / 1024 / 1024 ))
          echo "runner: ${total_gib} GiB, guest: ${need_gib} GiB (macos/26/steps/setup.yaml memory_mb: 16384)"
          # QEMU ITSELF, THE PAGE CACHE THE RECORDING WRITES THROUGH, AND THE 38 GiB DISK'S METADATA ALL
          # SIT NEXT TO THE GUEST, so a runner that only just fits is a runner that will be killed.
          if [ "$total_gib" -lt $(( need_gib + 8 )) ]; then
            echo "::error::this runner has ${total_gib} GiB and macOS 26 needs ${need_gib} GiB plus qemu's own overhead. The guest will be killed by the OOM killer a few minutes into the copy, with no error in any log - measured on run 44122437321. Use a larger runner (this walk was measured on a pod with a 24 GiB limit)."
            exit 1
          fi

  setup:
    needs: room
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos26
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos26-setup",
            "file": "macos/26/steps/setup.yaml",
            "pull": "",
            "assets": ["macos-recovery-tahoe:recovery.dmg", "macos-asset-boot-26:boot.img", "macos-asset-rom-26:macos.rom", "macos-asset-vars-26:macos.vars"],
            "out": "macos26.qcow2",
            "publish": "macos26",
            "timeout": 400
          }
        ]
