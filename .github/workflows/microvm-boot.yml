name: microvm-boot

# BOOT EVERY PUBLISHED ROOTFS VARIANT, BECAUSE BUILDING ONE IS NOT THE SAME AS STARTING IT.
#
# ---------------------------------------------------------------------------------------------------
# WHY THIS EXISTS
#
# `microvm-rootfs.yml` BUILDS the four variants and asserts each tarball is non-empty. That is all it
# does: it never hands one to qemu. MEASURED, the gap is not theoretical - `debian-minimal` and
# `nixos-minimal` were published for the first time and had never been started by anything, in CI or
# out of it. A rootfs that builds and does not boot is exactly the failure this workflow exists to
# catch, and no existing job could have caught it.
#
# `alpine-microvm.yml` DOES boot alpine, and it is not extended to cover the others for a reason: it
# exists to prove the TUN DEVICE, and it needs `CAP_NET_ADMIN`, `/dev/net/tun`, a socks5 echo and
# policy-routing assertions. None of that is about a rootfs. This workflow boots machines and asserts
# on their consoles; it needs no more privilege than a container to run qemu in.
#
# ---------------------------------------------------------------------------------------------------
# THE FOUR VARIANTS, AND WHY EACH WALKTHROUGH IS THE RIGHT ONE
#
#	rootfs-alpine-minimal   linux/alpine-microvm/steps/console.walk
#	rootfs-debian-minimal   linux/debian-microvm/steps/console.walk
#	rootfs-debian-xfce      linux/debian-microvm/steps/xfce.walk
#	rootfs-nixos-minimal    linux/nixos-microvm/steps/console.walk
#
# THE WALKTHROUGHS ALREADY EXISTED and already assert the thing that matters: the kernel claimed the
# disk, userspace started, and a login is waiting. That is the definition of "this rootfs boots", and
# none of these files install anything - they boot the medium they are handed.
#
# DEBIAN'S TWO USE DIFFERENT FILES ON PURPOSE. `console.walk` asserts a login, which is what
# `debian-minimal` must do. `xfce.walk` asserts `Xvfb` and `xfce4-session`, which is the whole
# difference between the variants - and running `console.walk` against the XFCE image would pass
# without ever proving the screen stack came up.
#
# ---------------------------------------------------------------------------------------------------
# WHAT IS NOT PROVEN HERE
#
# No network reachability, no UDP relay, no egress policy. Those live in `egress-e2e.yml` and
# `alpine-microvm.yml`, which need a proxy and a tun device. This job answers one question per
# variant, and it answers it by starting the machine.

on:
  push:
    branches: ["**"]
    # A BOOT TEST ONLY CHANGES WHEN THE WALKTHROUGH, THE IMAGE, OR THE DRIVER DOES. Building on every
    # push would start four virtual machines per commit for no new information.
    paths:
      - "linux/alpine-microvm/**"
      - "linux/debian-microvm/**"
      - "linux/nixos-microvm/**"
      - "linux/fedora-microvm/**"
      - "linux/ubuntu-microvm/**"
      - "linux/arch-microvm/**"
      - "linux/leap-microvm/**"
      - "internal/**"
      - "cmd/**"
      - "Containerfile"
      - ".github/workflows/microvm-boot.yml"
  pull_request:
    paths:
      - "linux/alpine-microvm/**"
      - "linux/debian-microvm/**"
      - "linux/nixos-microvm/**"
      - "linux/fedora-microvm/**"
      - "linux/ubuntu-microvm/**"
      - "linux/arch-microvm/**"
      - "linux/leap-microvm/**"
      - "internal/**"
      - "cmd/**"
      - "Containerfile"
      - ".github/workflows/microvm-boot.yml"
  # AND THE ROOTFS PUBLISHER, because it is the thing that can break a variant without touching a
  # line of Go: a bad `DESKTOP` switch produces an image that builds and cannot boot.
  workflow_run:
    workflows: ["microvm-rootfs", "nixos-microvm"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: microvm-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    # FOUR GUESTS, EACH WITH A 180-240 SECOND BOOT CEILING IN ITS OWN WALKTHROUGH. The matrix runs
    # them in parallel, so this is one guest's budget plus the build, not four of them.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: rootfs-alpine-minimal
            walk: linux/alpine-microvm/steps/console.walk
            # THE THREE MEMBERS THE TARBALL CARRIES, named here because `needs:` in the walkthrough
            # asks for them by name and a rename in either place would otherwise fail at step 1 with
            # a message about a missing medium.
            files: "alpine-vmlinuz alpine-initramfs alpine.qcow2"
          - tag: rootfs-debian-minimal
            walk: linux/debian-microvm/steps/console.walk
            files: "debian-vmlinuz debian-initramfs debian.qcow2"
          - tag: rootfs-debian-xfce
            walk: linux/debian-microvm/steps/xfce.walk
            files: "debian-vmlinuz debian-initramfs debian.qcow2"
          # THE NIXOS TARBALL USES DIFFERENT MEMBER NAMES - `nixos-kernel` rather than
          # `nixos-vmlinuz` - because that is what its workflow publishes. The walkthrough's `needs:`
          # names them, so the two must agree.
          - tag: rootfs-nixos-minimal
            walk: linux/nixos-microvm/steps/console.walk
            files: "nixos-kernel nixos-initrd nixos-rootfs.qcow2"
          # THE FOUR THAT WERE MEASURED BEFORE THIS WORKFLOW NAMED THEM. Each was booted by hand
          # against the same machine type the daemon uses, and the numbers are in each script's
          # header. They are here so a regression is caught by CI rather than by the next person
          # who tries to use one.
          - tag: rootfs-fedora-minimal
            walk: linux/fedora-microvm/steps/console.walk
            files: "fedora-vmlinuz fedora-initramfs fedora.qcow2"
          - tag: rootfs-ubuntu-minimal
            walk: linux/ubuntu-microvm/steps/console.walk
            files: "ubuntu-vmlinuz ubuntu-initramfs ubuntu.qcow2"
          - tag: rootfs-arch-minimal
            walk: linux/arch-microvm/steps/console.walk
            files: "arch-vmlinuz arch-initramfs arch.qcow2"
          - tag: rootfs-leap-minimal
            walk: linux/leap-microvm/steps/console.walk
            files: "leap-vmlinuz leap-initramfs leap.qcow2"

    steps:
      - uses: actions/checkout@v4

      # THE PUBLISHED ARTIFACT, NOT A LOCAL BUILD. A boot test of a locally built image would prove
      # the script works and say nothing about the bytes a consumer actually downloads - and the
      # digest mismatch between the two is the failure that matters.
      - name: pull ${{ matrix.tag }}
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ matrix.tag }}
          repository: ${{ github.repository }}
          dest: /tmp/rootfs
          path: ${{ matrix.tag }}.tar
          token: ${{ github.token }}

      # `oci-pull` WRITES TO THE WORKSPACE, NOT TO `dest` - see the long note in `alpine-microvm.yml`,
      # which measured it. The action's `path` output and its `dest` input were both misleading; the
      # file lands at the repository root.
      - name: unpack, and prove the tarball holds what the walkthrough asks for
        run: |
          set -eux
          mkdir -p /tmp/rootfs
          tar -xf "$GITHUB_WORKSPACE/${{ matrix.tag }}.tar" -C /tmp/rootfs
          rm -f "$GITHUB_WORKSPACE/${{ matrix.tag }}.tar"
          for f in ${{ matrix.files }}; do
            test -s "/tmp/rootfs/$f" || { echo "::error::$f is missing or empty in ${{ matrix.tag }}"; exit 1; }
            ls -l "/tmp/rootfs/$f"
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # THE IMAGE IS BUILT FROM THIS COMMIT, not pulled from `latest`, so the daemon under test is the
      # one in the tree. `Containerfile` COPYs `dist/easyvm`, so the binary is produced first - the
      # same way `alpine-microvm.yml` does it and the same way the release does.
      - name: build the daemon and the testing image
        run: |
          set -eux
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/easyvm ./cmd/easyvm
          docker build -f Containerfile --target tester -t easyvm-ci:local .

      - name: boot ${{ matrix.tag }}
        # NO `--cap-add NET_ADMIN` AND NO `/dev/net/tun`: this job does not relay anything. The
        # daemon asks for those only when `EASYVM_UDP_PROXY` is set, and it is not set here - so a
        # guest with no proxy gets a working direct TCP path and no tun device, which is all a boot
        # test needs.
        run: |
          set -eux
          work=$(mktemp -d)
          cp /tmp/rootfs/${{ matrix.files }} "$work"/
          cp ${{ matrix.walk }} "$work/walkthrough.walk"
          ls -l "$work"

          # KVM WHEN THE RUNNER HAS IT, TCG WHEN IT DOES NOT. `-e` rather than `-r`, because the
          # device is `crw-rw---- root:kvm` and a job container whose user is not in that group fails
          # the readable test while root inside it opens the device fine.
          kvm=""
          if [ -e /dev/kvm ]; then
            kvm="--device /dev/kvm:/dev/kvm"
            echo "::notice::using kvm"
          else
            echo "::notice::no /dev/kvm on this runner; the guest boots under tcg"
          fi

          docker run -d --name easyvm \
            --entrypoint easyvm \
            $kvm \
            -v "$work:/work" \
            easyvm-ci:local serve --work /work

          # `serve` PRINTS ITS READY LINE ONLY AFTER IT HAS THE LOCK, so this waits for readiness
          # rather than sleeping a fixed number of seconds.
          for i in $(seq 1 60); do
            if docker logs easyvm 2>&1 | grep -q 'listening on'; then break; fi
            sleep 1
          done
          docker logs easyvm 2>&1 | tail -10

          echo "WORK=$work" >> "$GITHUB_ENV"

      # THE RUN IS ASYNCHRONOUS: `run` returns as soon as the daemon has accepted the file, and the
      # daemon drives the steps. So this polls `status` until it says `finished` or `failed`, and
      # fails the job on the latter with the daemon's own sentence rather than a generic timeout.
      #
      # THE CEILING IS DERIVED FROM THE WALKTHROUGH rather than guessed. The longest boot sentence is
      # 240s (nixos) and the longest `wait:` is 30s (xfce), so 600s covers either one twice over on
      # TCG and finishes in seconds on KVM.
      - name: drive the walkthrough
        run: |
          set -eux
          docker exec easyvm /usr/local/bin/easyvm run /work/walkthrough.walk --work /work

          status=""
          for i in $(seq 1 120); do
            status=$(docker exec easyvm /usr/local/bin/easyvm status --work /work 2>&1 || true)
            echo "$status" | head -1
            case "$status" in
              *"status: finished"*|*"status: failed"*) break ;;
            esac
            sleep 5
          done

          echo "--- final ---"
          echo "$status"
          case "$status" in
            *"status: finished"*) echo "::notice::${{ matrix.tag }} booted" ;;
            *) echo "::error::${{ matrix.tag }} did not finish booting"; exit 1 ;;
          esac

      # THE CONSOLE IS THE EVIDENCE, AND IT IS UPLOADED EVEN WHEN THE RUN FAILED. A `status: failed`
      # with no console log says a step did not answer and leaves the reason inside a container that
      # is about to be removed.
      - name: the console log
        if: always()
        run: |
          docker cp easyvm:/work/console.log /tmp/console-${{ matrix.tag }}.log 2>/dev/null || true
          ls -l /tmp/console-${{ matrix.tag }}.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-${{ matrix.tag }}
          path: /tmp/console-${{ matrix.tag }}.log
          if-no-files-found: warn

      - name: the daemon's log, always
        if: always()
        run: docker logs easyvm 2>&1 | tail -60 || true

      - name: clean up
        if: always()
        run: docker rm -f easyvm 2>/dev/null || true