# A PROXY THAT ANSWERS, LOGS WHAT IT CARRIED, AND NEVER TOUCHES THE INTERNET.
#
# THIS IS THE UPSTREAM FOR THE EGRESS END-TO-END TEST. The question that test has to answer is "did
# THIS connection take the path the rules chose", and the only way to answer it from outside is to have
# each upstream say what it carried. 3proxy says it in its log, one line per request, with the
# destination in it.
#
# WHY 3PROXY RATHER THAN mihomo: this file needs a proxy, not a proxy MANAGER. mihomo's value is its
# rule engine and its subscription handling - both of which would be a second implementation of what is
# being tested here, and both of which need a config that is far larger than the thing under test. 3proxy
# is an HTTP CONNECT server, a SOCKS5 server and a log, which is exactly the surface this needs.
#
# `socks` IS NOT OPTIONAL. The UDP half of the relay speaks SOCKS5 UDP ASSOCIATE, and MEASURED on this
# image's README: "SOCKSv5 UDP and BIND support" is a documented feature, and it is the reason a real
# proxy can carry the guest's datagrams at all. An HTTP-only proxy cannot, because HTTP CONNECT cannot
# carry a datagram.
#
# THE LOG FORMAT IS THE ASSERTION. `%R:%r` is the destination and port, `%O` the outcome, and the
# timestamp lets the test look at only the lines a specific phase produced:
#
#	- +_L2026-11-19T12:34:56.000 3proxy.1234 CONNECT 10.0.0.1:5678 172.18.0.5:443 ...
#
# A `direct` connection must appear in NO log, and a `proxy:NAME` connection must appear in exactly
# that name's log. Both halves are checkable and neither depends on the far end being reachable.
#
# NO DNS. `nserver` is present because 3proxy requires one to start, but nothing in this test resolves
# a name through the proxy - the destinations are literals, and a name would make the assertion depend
# on a resolver.
nserver 223.5.5.5
nscache 65536
timeouts 1 5 30 60 180 1800 15 60

# EVERY LOG LINE, IN ONE FILE, IN A FORMAT A TEST CAN READ. `D` drops the default timestamp format so
# the one below is the only one.
log /var/log/3proxy/access.log D
logformat "- +_L%t.%. %N.%p %E %U %C:%c %R:%r %O %I %h %T"

# NO AUTHENTICATION. The network this runs on in CI is one container's, there is nothing to protect,
# and a password would make the test assert a credential rather than a transport.
auth none
allow *

# BOTH PROTOCOLS ON THE PORTS THE DAEMON IS TOLD ABOUT.
#
#	proxy   HTTP CONNECT, for TCP
#	socks   SOCKS5, for UDP ASSOCIATE - the datagrams the guest's QUIC and DNS need
#
# THE PORTS COME FROM THE ENVIRONMENT so one configuration file serves both the "primary" and the
# "backup" proxy in the test: they differ only in which port pair they listen on, which is what makes
# "which one carried this" a question with two possible answers.
proxy -p8080
socks -p1080
