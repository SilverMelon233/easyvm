name: android 13 (blissos 16.9.7) - start the installed disk
resolution:
- 1280
- 800

# THIS IS THE CLAIM THE INSTALL STAGE CANNOT MAKE.
#
# `install.yaml` ends by reading the ESP and asserting a loader is in it. That is a claim about
# BYTES. This is the claim about the MACHINE: the firmware finds the ESP, GRUB runs, the INSTALLED
# kernel boots the INSTALLED system, and Android's own launcher is drawn.
#
# SO THERE IS NO `kernel:` AND NO `iso:` HERE. Their absence is what selects the installed-disk shape:
# qemu gets one drive with `bootindex=0` and the firmware does the rest. A disk that needs the host to
# supply its kernel is not an installed system, and this stage would prove nothing about one.
#
# `bootindex=0` IS NOT DECORATION. With an empty NVRAM, OVMF's boot order is "UEFI Misc Device" then
# the NIC, and a bootable disk is NOT in it - measured:
#
#	BdsDxe: failed to load Boot0001 "UEFI Misc Device" ... Not Found
#	>>Start PXE over IPv4.   PXE-E16: No valid offer received.
#
# A published disk must not depend on an installer's NVRAM, so the disk is put first in the command
# line itself.
#
# AND THE ROOT= LINE IS THE ONE THE INSTALLER'S OWN grub.cfg USES, NOT A HAND-WRITTEN ONE. Measured,
# three ways, because the wrong value does not fail - it sits at "Detecting Android-x86..." forever:
#
#	SRC=                    the initrd scans for /mnt//system.img and never finds it
#	SRC=.                   finds nothing: system.img is in a SUBDIRECTORY named after the release
#	SRC=android-2024-10-11  mounts /mnt/android-2024-10-11/system.img and boots
#
# The directory name is the ISO's own build date and it is ON THE DISK, so the step below reads it
# rather than hard-coding it - a 16.9.8 would carry a different one.

vars:
  out:
    from: args.out
    default: out/blissos16-launch.qcow2
  # HOW LONG THE INSTALLED SYSTEM MAY TAKE TO PAINT ITS UI. 600 s is what this stage measured with
  # room to spare; a loaded runner is slower and Android is not a fast boot.
  boot_timeout:
    from: args.boot_timeout
    default: "600"

steps:
  - name: start recording
    record: blissos16-launch.mp4

  - name: boot the installed disk
    boot: true
    os: android
    memory_mb: 4096
    timeout: 300

  # =======================================================================================
  # THE DISK IS STARTED BY ITS OWN GRUB, AND GRUB IS ASKED FIRST
  # =======================================================================================
  #
  # A disk whose ESP is empty lands in the firmware's own shell, and a disk whose ESP has a loader but
  # whose config is missing lands at the `grub>` prompt - two different failures with two different
  # sentences, and neither is visible from a screenshot of a black screen. What is checked is that
  # the machine got as far as GRUB, because that is the fact the install stage's byte-level ESP check
  # could not establish.
  - name: the firmware found the ESP and GRUB is running
    loop:
      max: 60
      do:
      - wait: 5
      ocr:
        name: grub
        region:
        - 0
        - 0
        - 1280
        - 200
        region_at:
        - 1280
        - 800
        scale: 1
        wait: 0
      check:
        name: reached
        from: grub
        mode: says_any
        # EITHER THE MENU OR THE PROMPT. A menu means grub.cfg was found; a prompt means the loader
        # ran and the config did not, which is a real failure but a LATER one - and telling them
        # apart is why both words are here rather than only the happy one.
        words:
        - - grub
        - - blissos
      until:
        fact: reached

  # =======================================================================================
  # THE INSTALLED SYSTEM'S OWN UI
  # =======================================================================================
  #
  # `desktop: android` IS NOT A PAINTED-FRAME TEST. Android paints the boot animation and recovery
  # text too, so structure is not enough: the test reads the frame for one of four word groups - the
  # home-app chooser, the lock screen, Taskbar, or Smart Dock.
  #
  # THE LOCK SCREEN IS A SUCCESS. Once a home app has been chosen, the SAME disk boots past the
  # chooser to the lock screen ("Unlock for all features and data"), and a test that only looked for
  # the chooser would call that a failure while the guest sat on a perfectly drawn Android lock
  # screen. Both mean "Android is running from this disk".
  - name: wait for Android's own UI
    desktop: android
    timeout: '{{ boot_timeout }}'
    poll: 10

  # ONE PICTURE, KEPT. It is the evidence a run passed, and it cannot be produced without the guest
  # being up.
  - name: photograph the screen
    screenshot: screen.png

  # =======================================================================================
  # STOPPED, NOT ASKED
  # =======================================================================================
  #
  # There is no sshd and no guest agent on this disk - Android's remote access is adb, and nothing
  # listens on 22 - so there is no method that asks the guest anything. `kill` is the honest name for
  # what happens, and `shutdown:` refuses to hide it behind a fallback chain.
  - name: stop the machine
    shutdown: kill
    timeout: 120

  - name: stop recording
    record: false
