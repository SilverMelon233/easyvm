name: android 13 (blissos 16.9.7) - start the installed disk
resolution:
- 1920
- 1080

# THIS IS THE CLAIM THE INSTALL STAGE CANNOT MAKE.
#
# `install.yaml` ends by reading the ESP and finding `/EFI/BLISSOS/BOOTX64.EFI` in it. That is a claim
# about BYTES. This is the claim about the MACHINE: the firmware finds the ESP, GRUB runs, the
# INSTALLED kernel boots the INSTALLED system, and Android's own launcher is drawn.
#
# SO THERE IS NO `iso:` HERE. Its absence selects the installed-disk shape: qemu gets one drive with
# `bootindex=0` and the firmware does the rest. A disk that needs the host to supply a medium is not
# an installed system, and this stage would prove nothing about one.
#
# `bootindex=0` IS NOT DECORATION. With an empty NVRAM, OVMF's boot order is "UEFI Misc Device" then
# the NIC, and a bootable disk is NOT in it - measured:
#
#	BdsDxe: failed to load Boot0001 "UEFI Misc Device" ... Not Found
#	>>Start PXE over IPv4.   PXE-E16: No valid offer received.
#
# A published disk must not depend on an installer's NVRAM, so the disk is put first in the command
# line itself by `boot:` when nothing installs.
#
# THE KERNEL LINE COMES FROM THE DISK'S OWN grub.cfg, WHICH IS THE POINT. The install stage's
# bootloader pane wrote /EFI/BLISSOS/GRUB.CFG, and GRUB reads it and loads that kernel with that
# command line. Nothing here knows the path `android-2024-10-11` or the words `HWC=drm_minigbm`;
# if they are wrong the screen says so, which is what makes this a test of the disk.

vars:
  out:
    from: args.out
    default: out/blissos16-launch.qcow2
  # HOW LONG THE INSTALLED SYSTEM MAY TAKE TO PAINT ITS UI. 600 s is what this stage measured with
  # room to spare; a loaded runner is slower and Android is not a fast boot.
  boot_timeout:
    from: args.boot_timeout
    default: "600"

steps:
  - name: start recording
    record: blissos16-launch.mp4

  - name: boot the installed disk
    boot: true
    os: android
    memory_mb: 4096
    timeout: 300

  # =======================================================================================
  # THE DISK IS STARTED BY ITS OWN GRUB, AND GRUB IS ASKED FIRST
  # =======================================================================================
  #
  # A disk whose ESP is empty lands in the firmware's own shell; a disk whose ESP has a loader but no
  # config lands at the `grub>` prompt; a disk whose config names a kernel that is not there prints
  # "error: no such device" and stops. Three different failures, three different sentences, and none
  # of them is visible from a screenshot of a black screen - so the first thing this checks is that
  # the machine got as far as GRUB, because that is the fact the install stage's byte-level ESP read
  # could not establish.
  - name: the firmware found the ESP and GRUB is running
    loop:
      max: 60
      do:
      - wait: 5
      ocr:
        name: boot
        region:
        - 0
        - 0
        - 1920
        - 1080
        region_at:
        - 1920
        - 1080
        scale: 1
        wait: 0
      check:
        name: reached
        from: boot
        mode: says_any
        # EITHER THE MENU OR THE ANDROID SPLASH. A menu means grub.cfg was found and is being shown;
        # the splash means it was found and the entry was taken. Both are "the disk started itself".
        words:
        - - blissos
        - - android
        - - grub
      until:
        fact: reached

  # =======================================================================================
  # THE INSTALLED SYSTEM'S OWN UI
  # =======================================================================================
  #
  # `desktop: android` IS NOT A PAINTED-FRAME TEST. Android paints the boot animation and recovery
  # text too, so structure is not enough: the test reads the frame for one of four word groups - the
  # home-app chooser, the lock screen, Taskbar, or Smart Dock.
  #
  # THE LOCK SCREEN IS A SUCCESS. Once a home app has been chosen, the SAME disk boots past the
  # chooser to the lock screen ("Unlock for all features and data"), and a test that only looked for
  # the chooser would call that a failure while the guest sat on a perfectly drawn Android lock
  # screen. Both mean "Android is running from this disk".
  - name: wait for Android's own UI
    desktop: android
    timeout: '{{ boot_timeout }}'
    poll: 10

  # ONE PICTURE, KEPT. It is the evidence a run passed, and it cannot be produced without the guest
  # being up.
  - name: photograph the screen
    screenshot: screen.png

  # =======================================================================================
  # STOPPED, NOT ASKED
  # =======================================================================================
  #
  # There is no sshd and no guest agent on this disk - Android's remote access is adb, and nothing
  # listens on 22 - so there is no method that asks the guest anything. `kill` is the honest name for
  # what happens, and `shutdown:` refuses to hide it behind a fallback chain.
  - name: stop the machine
    shutdown: kill
    timeout: 120

  - name: stop recording
    record: false
