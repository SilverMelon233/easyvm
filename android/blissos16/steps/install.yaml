name: android 13 (blissos 16.9.7) - install onto a disk this file makes
resolution:
- 1280
- 800

# BLISSOS INSTALLS ITSELF ONTO A DISK THIS FILE ALSO MAKES, UNDER REAL UEFI.
#
# Android-x86 is not a distribution with an installer you point at a disk; it is a set of files that
# an initrd assembles into a running system, and its `INSTALL=1` path copies those files onto a
# partition. Two consequences shape every step below, and both were measured on a live guest before
# a line of this file was written:
#
#   THE ISO IS NOT BOOTABLE, SO QEMU IS HANDED A KERNEL.
#   `boot:` passes `-kernel` and `-initrd` taken out of the ISO's own directory. Firmware booting
#   this ISO gets nowhere at all. The INSTALLED disk is a different story: it boots through UEFI and
#   GRUB with no `-kernel`, which is what makes `launch` a proof rather than a re-run.
#
#   THE PARTITIONS HAVE TO BE THERE FIRST.
#   The installer's first pane lists the partitions it FINDS. Given a blank disk it offers
#   "Create/Modify partitions" and half this file would be driving a partitioner; given the table
#   below it shows `vda1 0.25GB` already selected and ten key presses finish the job.
#
# THE TEN PANES ARE ANSWERED BY KEY AND SETTLE, NOT BY OCR, AND THAT IS MEASURED RATHER THAN LAZY.
# Two DIFFERENT dialogs read back identically to tesseract on a whole frame:
#
#	Please select a filesystem to format vda1:   ->  ... | format | udal:
#	Please select a filesystem to format vda2:   ->  ... | format | udaz:
#
# and on a cropped read the others become indistinguishable, because the crop that captures a
# one-line question loses the body of a confirm dialog. A `dialog` TUI does not need to be searched
# for: its rows never move, its focus order is fixed, and its accelerators are one letter each.
#
# AND ONE OCR STEP IS STILL HERE, ON THE PANE WHERE NOTHING ELSE CAN ANSWER: `AUTO_INSTALL` IS ABSENT
# ON PURPOSE, so "Choose EFI Boot" appears and Grub2 is written. The reason is in the installer's own
# source: with AUTO_INSTALL set it skips the search for the EF00 partition, `esp` stays empty, that
# pane never appears, and install_grub_efi is never called.

vars:
  out:
    from: args.out
    default: out/blissos16.qcow2
  # 128 GiB, WHICH IS THIS REPOSITORY'S SIZE FOR EVERY DISK. easydiskbake used 32 GiB for BlissOS
  # because 32 holds the 2.25 GiB system plus the /data it grows into - and the number that matters
  # for THIS repository is not the guest's, it is the published artifact's, and both are sparse.
  # The installer's own pane draws the result as "125.7GB" rather than "31.75GB"; nothing in the
  # ten key presses reads a capacity, which is why the change is safe.
  disk_gb:
    from: args.disk_gb
    default: "128"
  # 260 MiB is what `sgdisk --new=1::+260M` produces and what the installer draws as "0.25GB".
  esp_mib:
    from: args.esp_mib
    default: "260"

steps:
  - name: start recording
    record: blissos16-install.mp4

  # =======================================================================================
  # 1. THE DISK, BEFORE THE MACHINE
  # =======================================================================================
  #
  # A GPT with a 260 MiB ESP typed EF00 and Linux on the rest. `disk_gpt:` writes it with the GPT
  # code in internal/run/gpt.go, which needs no partitioning tool - this image has none.
  #
  # THE ESP IS 1 MiB ALIGNED AT LBA 2048 AND TYPED C12A7328-F81F-11D2-BA4B-00A0C93EC93B, and both
  # halves were measured by getting them wrong:
  #
  #	vda1 starting at LBA 34    the installer lists NO partitions, and answers
  #	                           "No ESP is selected, setup will use the old detection method"
  #	wrong ESP type GUID        "This is not an EFI System Partition, please check again"
  - name: give the installer a disk
    disk: disk.qcow2
    disk_gb: '{{ disk_gb }}'
    disk_gpt: true
    disk_esp_mib: '{{ esp_mib }}'

  # =======================================================================================
  # 2. THE THREE FILES OUT OF THE ISO
  # =======================================================================================
  #
  # `fetch:` puts the pinned ISO in the work directory. The kernel and initrd have to come OUT of it,
  # because qemu loads them with `-kernel`/`-initrd` and neither is a file on the ISO's surface - the
  # kernel is at the root but the ISO is 2.2 GiB, so unpacking the three members is a `7z x` of
  # specific paths rather than a full extract.
  - name: fetch the installer image
    asset: linux_iso
    release: blissos-16.9.7

  - name: unpack the kernel and initrd the installer boots with
    script: 7z x -y -o. bliss16.iso kernel initrd.img
    script_shell: sh
    script_name: unpack.sh

  # =======================================================================================
  # 3. THE MACHINE
  # =======================================================================================
  #
  # `os: android` WITH `iso:` AND `kernel:` IS THE INSTALLER SHAPE. The ISO is a cdrom the installer
  # reads /src/install.img out of, and the kernel and initrd are the ones it would have loaded from
  # its own boot menu.
  #
  # THE COMMAND LINE IS SHORT ON PURPOSE. `INSTALL=1` is what makes init install rather than run a
  # live system. `HWC=drm_minigbm` picks the hardware composer a plain qemu VGA supports - the
  # installed system needs a DRM node and this adapter does not provide one, so the alternative dies
  # on initrd's last line.
  #
  # NO `console=ttyS0`: with it the TUI moves to the serial line and every key this file sends goes
  # to a console nobody is drawing on. Measured, four runs.
  - name: boot the installer
    boot: true
    os: android
    iso: installer_iso
    kernel: kernel
    initrd: initrd.img
    append: root=/dev/ram0 INSTALL=1 HWC=drm_minigbm GRALLOC=minigbm
    memory_mb: 4096
    timeout: 900

  # 50 s is initrd, the hardware probe and the first pane. `boot:` is over when qemu is running,
  # which is well before that, so the wait is explicit.
  - name: let the installer draw its first pane
    wait: 50

  # The verdict on everything above: a pane with partitions in it. Without the GPT this reads
  # "Create/Modify partitions" and nothing else, and every key below would go somewhere else.
  - name: the partition list has the ESP in it
    ocr:
      name: partlist
      region:
      - 320
      - 350
      - 960
      - 420
      region_at:
      - 1280
      - 800
      scale: 2
      wait: 0
  - name: vda1 is listed
    check:
      name: has_esp
      from: partlist
      mode: says
      words:
      - vda1

  # =======================================================================================
  # 4. THE TEN PANES
  # =======================================================================================
  #
  # Every settle is a measurement, from a run that worked. A short one does not fail: the next key
  # is delivered to a pane that has not drawn yet and the TUI eats it.

  # "Choose Partition / UEFI System detected ! Please select a partition as EFI System Partition
  # (ESP)" with vda1 on a solid bar.
  - name: open the ESP's filesystem question
    key: ret
    wait_after: 15

  # "Please select a filesystem to format vda1: Do not re-format / Fat32 (CAREFUL)". The default is
  # Do not re-format, which would leave the table's bytes with no filesystem on them - and an ESP
  # with no FAT is one the firmware cannot read.
  - name: choose FAT32
    key:
    - f
    wait_after: 3
  - name: confirm the filesystem
    key: ret
    wait_after: 10
  # The label field already holds ESP; Return keeps it.
  - name: keep the ESP label
    key: ret
    wait_after: 12
  # "Are you sure to format the partition vda1?" with <Yes> <No> and NO preselection.
  - name: select Yes for the ESP format
    key: left
    wait_after: 2
  - name: format the ESP
    key: ret
    wait_after: 30

  # The same window, now listing the formatted ESP as vfat/ESP and asking for the system partition.
  - name: move to the system partition
    key: down
    wait_after: 3
  - name: open vda2
    key: ret
    wait_after: 15
  # Six rows; `e` is ext4, the first row starting with e, and dialog takes the first match.
  - name: choose ext4
    key:
    - e
    wait_after: 3
  - name: confirm the filesystem for vda2
    key: ret
    wait_after: 10
  - name: keep the system volume label
    key: ret
    wait_after: 12
  - name: select Yes for the system format
    key: left
    wait_after: 2

  # THE LONGEST SETTLE IN THIS FILE. This formats 32 GiB and then copies 2.2 GB into it - measured a
  # little over four minutes on the disk that produced the numbers below, and the copy keeps running
  # after the pane advances, which is why the bootloader step's settle is also generous.
  - name: format vda2 and copy the system
    key: ret
    wait_after: 300

  # "This operation will double the system size" - declining keeps one copy. The default is Yes and
  # `right` is what says No; on a disk with 32 GiB there is no room for two 2.2 GiB systems plus the
  # /data Android expects to grow into.
  - name: decline the OTA preparation
    key: right
    wait_after: 3
  - name: confirm the OTA answer
    key: ret
    wait_after: 40

  # =======================================================================================
  # 5. THE BOOTLOADER
  # =======================================================================================
  #
  # "Choose EFI Boot / Since you are using UEFI, we offer two boot options for the OS: rEFInd Boot
  # Manager or Grub2 EFI Bootloader." Grub2 is the first row and preselected.
  #
  # THIS PANE ONLY EXISTS BECAUSE `AUTO_INSTALL` IS NOT SET. See this file's header: on that path the
  # ESP is left empty and the disk falls through to the firmware's shell.
  - name: write Grub2 into the ESP
    key: ret
    wait_after: 200

  # "Congratulations! BlissOS-16.9.7 is installed successfully." It is read rather than assumed,
  # because every pane above reports nothing when it fails.
  - name: the installer says it finished
    ocr:
      name: done
      region:
      - 320
      - 280
      - 960
      - 340
      region_at:
      - 1280
      - 800
      scale: 2
      wait: 0
  - name: it really says congratulations
    check:
      name: installed
      from: done
      mode: says_any
      words:
      - - congratulations
      - - successfully

  # =======================================================================================
  # 6. THE DISK IS STOPPED BEFORE IT IS READ
  # =======================================================================================
  #
  # `kill` RATHER THAN A GRACEFUL ONE, AND IT IS THE HONEST CHOICE HERE. This guest was started from
  # an ISO; the installer has already written everything and returned to its menu. It has no sshd and
  # no agent, and ACPI on an installer leaves the TUI up. The step after this one opens the qcow2,
  # which needs the write lock qemu would still hold - measured: reading it while qemu ran failed
  # with "Failed to get shared write lock", and the first version reported that as "the ESP has no
  # bootloader", a wrong verdict about a disk that was fine.
  - name: stop the installer
    shutdown: kill
    timeout: 120

  - name: publish the disk
    compress: '{{ out }}'

  - name: stop recording
    record: false
