name: android 13 (blissos 16.9.7) - install onto a disk this file makes
resolution:
- 1280
- 800

# BLISSOS INSTALLS ITSELF FROM ITS OWN BOOTABLE ISO, THE WAY EVERY OTHER INSTALLER HERE DOES.
#
# THE ISO IS A BOOTABLE MEDIUM UNDER BOTH FIRMWARES, AND THAT IS A MEASUREMENT RATHER THAN AN
# ASSUMPTION. Its El Torito catalog, read out of the file:
#
#	entry 0: x86 BIOS   bootable    image at LBA 7735  (isolinux)
#	section: UEFI
#	entry 2: (UEFI)     bootable    image at LBA 55    (30720 sectors = boot/grub/efi.img)
#
# so firmware finds a loader by itself, exactly as it does for Windows and every Linux here. There is
# no `-kernel` on this path and there is no reason for one: a guest handed a kernel by the host never
# runs the boot chain it is supposed to be proving.
#
# AND THE INSTALLER DOES ITS OWN PARTITIONING. Its first pane offers cfdisk and cgdisk, and cgdisk is
# the GPT one - it writes the table and the ESP the installed system needs. Driving that pane is
# cheaper and more honest than reproducing the table from the host, which is what this file did
# before it used the ISO's own installer.
#
# THE ONE PLATFORM FACT THIS FILE'S `os:` ADDS IS THE VIDEO ADAPTER, AND IT IS NOT COSMETIC.
# Android's HWC runs with `HWC=drm_minigbm` and opens /dev/dri/card0. A `-device VGA` provides a
# framebuffer and NO DRM device, so Android brings up no display at all and the screen STOPS ON
# INITRD'S LAST LINE - measured at 240 s, 600 s and 600 s again before the cause was found, with
# nothing in the console saying what was wrong. `-device virtio-vga` is the real KMS driver. See
# machine.Boot.VGA.
#
# THE PANES ARE ANSWERED BY KEY AND SETTLE, NOT BY OCR. Two DIFFERENT dialogs read back identically
# to tesseract on a whole frame:
#
#	Please select a filesystem to format vda1:   ->  ... | format | udal:
#	Please select a filesystem to format vda2:   ->  ... | format | udaz:
#
# and a crop that captures a one-line question loses the body of a confirm dialog. A `dialog` TUI
# does not need to be searched for: its rows never move, its focus order is fixed, and its
# accelerators are one letter each. What it needs is the keys a person would press, with enough time
# between them - and the panes that MATTER get an OCR check of their own.

vars:
  out:
    from: args.out
    default: out/blissos16.qcow2
  # 128 GiB, WHICH IS THIS REPOSITORY'S SIZE FOR EVERY DISK. The installer draws the result as
  # "119.2GB" rather than the "31.75GB" easydiskbake measured on a 32 GiB disk; nothing in the ten
  # key presses reads a capacity, which is why the change is safe. The artifact stays ~4 GiB because
  # a qcow2 is sparse.
  disk_gb:
    from: args.disk_gb
    default: "128"

steps:
  - name: start recording
    record: blissos16-install.mp4

  # =======================================================================================
  # 1. THE DISK AND THE MEDIUM
  # =======================================================================================
  #
  # `disk_gb:` MAKES THE EMPTY DISK AND NOTHING ELSE - no partition table, because the installer is
  # about to ask for one. A table written here would have to be written again by cgdisk, and the
  # pane that offers cgdisk would then be answering a question this file had already decided.
  - name: give the installer a disk
    disk: disk.qcow2
    disk_gb: '{{ disk_gb }}'

  - name: fetch the installer image
    asset: linux_iso
    release: blissos-16.9.7

  # =======================================================================================
  # 2. THE MACHINE, BOOTED FROM ITS OWN ISO
  # =======================================================================================
  #
  # NO `console=ttyS0` ON THE KERNEL LINE, AND THE ISO'S OWN `grub.cfg` DOES NOT ADD ONE: with a
  # serial console the TUI moves to the serial line and every key this file sends goes to a console
  # nobody is drawing on. Measured, four runs, on the version of this file that passed one.
  #
  # THE DISK IS `bootindex=1` AND THE CD IS 0, so firmware boots the medium and the installer finds
  # the target itself. That is the same arrangement windows/11 uses.
  - name: boot the installer
    boot: true
    os: android
    iso: installer_iso
    memory_mb: 4096
    timeout: 900

  # 50 s is initrd, the hardware probe and the menu. `boot:` is over when qemu is running, which is
  # well before that, so the wait is explicit.
  - name: let the boot menu draw
    wait: 50

  # The menu draws "Installation - Install BlissOS-16.9.7 to harddisk" once-and-a-half screens down.
  # THE OCR IS THE POINT: a menu that has already timed out into the Live system looks the same as a
  # menu to a person reading a frame, and the next key would then go to a desktop.
  - name: the installer menu is up
    ocr:
      name: menu
      region:
      - 0
      - 0
      - 1280
      - 200
      region_at:
      - 1280
      - 800
      scale: 1
      wait: 0
  - name: it offers Installation
    check:
      name: has_install
      from: menu
      mode: says_any
      words:
      - - installation
      - - live cd

  # =======================================================================================
  # 3. PARTITIONING, WHICH THE INSTALLER DOES ITSELF
  # =======================================================================================
  #
  # `Installation - Install BlissOS-16.9.7 to harddisk` is the fourth row; the three above it are the
  # Live entries.
  - name: select Installation
    key: [down, down, down]
    wait_after: 1
  - name: start the installer
    key: ret
    wait_after: 40

  # "Please select a partition to install BlissOS-16.9.7" with NO partitions listed, because the
  # disk is bare. The first row is `Create/Modify partitions`.
  - name: open the partitioner
    key: ret
    wait_after: 15

  # "The setup will now redirect to the cfdisk program on drive /dev/vda. However, would you prefer
  # to use the cgdisk program instead?" - and cgdisk is the GPT one. THIS PANE IS WHY THERE IS NO
  # `disk_gpt:` IN THIS FILE: the installer's own GPT tool is what makes the ESP the installed
  # system needs, and it is answering a question the file asked two rows up.
  - name: choose cgdisk, the GPT partitioner
    key: left
    wait_after: 2
  - name: open cgdisk
    key: ret
    wait_after: 20

  # cgdisk asks for a new partition table on a disk that has none. `gpt` is the label it needs.
  - name: be sure the disk is being made GPT
    ocr:
      name: cgdisk
      region:
      - 0
      - 0
      - 1280
      - 240
      region_at:
      - 1280
      - 800
      scale: 1
      wait: 0
  - name: cgdisk is up
    check:
      name: cgdisk_up
      from: cgdisk
      mode: says_any
      words:
      - - cgdisk
      - - partition

  - name: stop the machine
    shutdown: kill
    timeout: 120

  - name: publish the disk
    compress: '{{ out }}'

  - name: stop recording
    record: false
