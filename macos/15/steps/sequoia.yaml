name: macos 15 sequoia setup assistant
resolution:
- 1920
- 1080
ends:
- finder
ends_region:
- 0
- 0
- 700
- 34
ends_region_scale: 3
ends_at:
- name: the login window's password field
  rect:
  - 880
  - 960
  - 1045
  - 1000
  scale: 6
  words:
  - enter
  - password
waits_for:
- - country
  - region
- - transfer
  - data
- - spoken
  - languages
- - accessibility
  - individual
- - data
  - privacy
- - create
  - mac
  - account
- - sign
  - in
  - to
  - your
  - apple
  - account
- - terms
  - conditions
- - location
  - services
- - time
  - zone
- - analytics
  - improve
- - screen
  - report
- - look
  - appearance
- - welcome
  - mac
- - keyboard
  - select
boot_timeout: 1800
boot_poll: 10
stuck_after: 20
pane_limit: 3
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  shutdown:
    from: args.shutdown
    default: ssh
boot_disk: from_caller
steps:
- name: boot the disk
  boot: true
  os: macos
  timeout: 900
- name: analytics
  when:
  - analytics
  - improve
  do:
  - click:
    - 808
    - 513
    settle: 3
  - click:
    - 1306
    - 810
    settle: 10
- name: data and privacy
  when:
  - privacy
  - fundamental
  click:
  - 1306
  - 810
  settle: 8
- name: written and spoken languages
  when:
  - spoken
  - languages
  click:
  - 1306
  - 810
  settle: 8
- name: accessibility
  when:
  - accessibility
  - individual
  click:
  - 1306
  - 806
  settle: 12
- name: transfer your data
  when:
  - transfer
  - data
  do:
  - click:
    - 825
    - 669
    settle: 4
  - click:
    - 1306
    - 810
    settle: 10
- name: country or region
  when:
  - country
  - region
  do:
  - click:
    - 900
    - 500
    settle: 2
  - click:
    - 900
    - 500
    type: united states
    settle: 3
  - click:
    - 1306
    - 810
    settle: 8
- name: create a mac account
  when:
  - create
  - mac
  - account
  rect:
  - 300
  - 300
  - 1620
  - 340
  rect_at:
  - 1920
  - 1080
  scale: 2
  do:
  - click:
    - 945
    - 447
    type: '{{ user }}'
    modifier: meta_l
    settle: 3
  - click:
    - 850
    - 531
    type: '{{ password }}'
    modifier: meta_l
    settle: 3
  - click:
    - 1086
    - 531
    type: '{{ password }}'
    modifier: meta_l
    settle: 3
  - click:
    - 1306
    - 810
    settle: 180
- name: enable location services
  when:
  - approximate
  - location
  do:
  - click:
    - 1306
    - 810
    settle: 6
  - click:
    - 960
    - 632
    settle: 3
  - key: ret
    settle: 6
- name: screen time
  when:
  - screen
  - report
  click:
  - 619
  - 806
  settle: 8
- name: time zone
  when:
  - time
  - zone
  click:
  - 1306
  - 806
  settle: 10
- name: choose your look
  when:
  - look
  - appearance
  click:
  - 1306
  - 805
  settle: 12
- name: terms and conditions
  when:
  - terms
  - conditions
  do:
  - click:
    - 1298
    - 806
    settle: 8
  - click:
    - 1019
    - 616
    settle: 10
- name: welcome to mac
  when:
  - welcome
  - mac
  click:
  - 960
  - 990
  settle: 12
- name: keyboard
  when:
  - keyboard
  - assistant
  click:
  - 1222
  - 818
  settle: 12
- name: sign in to apple account
  when:
  - sign
  - in
  - to
  - your
  - apple
  - account
  rect:
  - 300
  - 420
  - 1620
  - 460
  rect_at:
  - 1920
  - 1080
  scale: 2
  do:
  - click:
    - 620
    - 811
    settle: 2
  - key: ret
    settle: 3
  - click:
    - 1026
    - 634
    settle: 2
  - key: ret
    settle: 2
- name: the apple account pane is gone
  loop:
    max: 20
    do:
    - settle: 3
    see:
      of: [text]
      name: screen
      rect:
      - 0
      - 0
      - 1920
      - 1080
      rect_at:
      - 1920
      - 1080
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - update
        - automatically
      - - choose
        - a
        - look
      - - welcome
        - to
        - mac
    until:
      fact: done
- name: update mac automatically
  when:
  - update
  - automatically
  click:
  - 1306
  - 810
  settle: 15
- name: click the password field
  click:
  - 965
  - 981
  skip_when_unfinished: true
  settle: 1
- name: type the password
  type: '{{ password }}'
  skip_when_unfinished: true
  settle: 1
- name: press return
  key: ret
  skip_when_unfinished: true
  settle: 20
- name: dismiss the overlays macOS puts up on a first login
  do:
  - click:
    - 1228
    - 826
    settle: 4
  - click:
    - 1228
    - 826
    settle: 4
  - click:
    - 1228
    - 826
    settle: 4
  - key: esc
    settle: 2
  - key: meta_l+q
    settle: 2
  - key: esc
    settle: 2
  skip_when_unfinished: true
- name: wait for the desktop
  desktop: macos
  timeout: 300
  skip_when_unfinished: true
- name: stop the machine
  shutdown: '{{ shutdown }}'
  timeout: 300
