name: macos 26 setup (recovery image to setup assistant)
resolution:
- 1920
- 1080
vars:
  out:
    from: args.out
    default: out/macos26.qcow2
  disk_name:
    default: main
  expected_gb:
    default: '68'
  shutdown:
    from: args.shutdown
    default: kill
steps:
- name: the media this stage boots from is already on disk
  require:
  - recovery.dmg
  - boot.img
  - macos.rom
  - macos.vars
- name: start recording
  record: macos26-setup.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the recovery image
  boot: true
  os: macos
  recovery: recovery.dmg
  memory_mb: 16384
  timeout: 900
- name: the recovery menu's rows
  ocr:
    name: recovery
    region:
    - 760
    - 200
    - 1400
    - 560
    region_at:
    - 1920
    - 1080
    scale: 6
    wait: 5
- name: wait for the recovery menu
  loop:
    max: 180
    do:
    - wait: 10
    ocr:
      name: recovery
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 6
      wait: 0
    check:
      name: done
      from: recovery
      mode: says_any
      words:
      - - restore
        - time
        - machine
      - - reinstall
        - macos
      - - safari
      - - disk
        - utility
    until:
      fact: done
- name: select disk utility
  click:
  - 800
  - 523
  wait_after: 3
- name: open disk utility
  click:
  - 1148
  - 595
  wait_after: 8
- name: make disk utility full screen
  at_color:
  - 40
  - 200
  - 64
  color_tolerance: 45
  color_region:
  - 0
  - 30
  - 700
  - 400
  wait_after: 6
- name: select the first disk
  click:
  - 200
  - 132
  wait_after: 2
- name: is the selected disk the uninitialised one
  ocr:
    name: details
    region:
    - 360
    - 105
    - 1100
    - 200
    region_at:
    - 1920
    - 1080
    scale: 4
    wait: 0
- name: the first disk is the uninitialised one
  check:
    name: uninitialised
    from: details
    mode: contains
    text: Uninitialized
- name: select the second disk, when row 1 was the boot image
  if: uninitialised
  else:
  - name: click row 2
    click:
    - 200
    - 164
    wait_after: 2
  - name: is the second disk the uninitialised one
    ocr:
      name: details
      region:
      - 360
      - 105
      - 1100
      - 200
      region_at:
      - 1920
      - 1080
      scale: 4
      wait: 0
  - name: the second disk is the uninitialised one
    check:
      name: uninitialised
      from: details
      mode: contains
      text: Uninitialized
- name: erase - open the sheet
  loop:
    max: 6
    do:
    - click:
      - 1711
      - 56
    - wait: 3
    ocr:
      name: sheet
      region:
      - 720
      - 425
      - 1200
      - 680
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: sheet_up
      from: sheet
      mode: says_any
      words:
      - - erase
        - deleted
      - - free
        - space
      - - security
        - option
      - - cancel
        - erase
    until:
      fact: sheet_up
  wait_after: 4
- name: erase - clear the name field
  key: meta_l+a
  wait_after: 1
- name: erase - name the volume
  click:
  - 988
  - 542
  type: '{{ disk_name }}'
  wait_after: 4
- name: erase - confirm
  click:
  - 1154
  - 650
  wait_after: 5
- name: erase - wait for the report
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - erase
        - complete
      - - erase
        - process
    until:
      fact: done
- name: erase - done
  click:
  - 1147
  - 614
  wait_after: 5
- name: close disk utility
  key: meta_l+q
  wait_after: 12
- name: the recovery menu is back
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - reinstall
      - macos
    until:
      fact: done
- name: select reinstall macos
  click:
  - 837
  - 333
  wait_after: 3
- name: open the installer
  click:
  - 1142
  - 586
  wait_after: 20
- name: wait for the installer to load
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: instaload
      region:
      - 400
      - 560
      - 1520
      - 700
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: loaded
      from: instaload
      mode: says_any
      words:
      - - agree
        - to
        - the
        - terms
      - - english
        - apple
      - - select
        - the
        - disk
      - - macos
    until:
      fact: loaded
- name: welcome continue
  click:
  - 960
  - 712
  wait_after: 5
- name: wait for the licence pane
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: licence
      region:
      - 660
      - 430
      - 1260
      - 700
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: licence_up
      from: licence
      mode: says_any
      words:
      - - software
        - license
        - agreement
      - - please
        - read
        - this
    until:
      fact: licence_up
- name: agree to the licence
  click:
  - 1005
  - 713
  wait_after: 5
- name: wait for the licence sheet
  loop:
    max: 12
    do:
    - wait: 5
    ocr:
      name: sheet
      region:
      - 780
      - 330
      - 1140
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: sheet_up
      from: sheet
      mode: says_any
      words:
      - - read
        - and
        - agree
      - - disagree
        - agree
    until:
      fact: sheet_up
- name: agree in the sheet
  click:
  - 1018
  - 520
  wait_after: 10
- name: select the destination card
  click:
  - 850
  - 550
  wait_after: 5
- name: destination continue
  click:
  - 1005
  - 712
  wait_after: 10
- name: the copy runs, look 1 of at most 8
  loop:
    max: 270
    do:
    - wait: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words: &id001
      - - select
        - your
        - country
        - or
        - region
      - - how
        - do
        - you
        - want
        - to
        - connect
        - to
        - the
        - internet
      - - transfer
        - your
        - information
        - to
        - this
        - mac
      - - choose
        - a
        - wireless
        - network
      - - sign
        - in
        - with
        - your
        - apple
        - id
    until:
      fact: done
- name: reset the guest after look 1, because this installer stalls and a reset is what moves it
  reboot: true
  timeout: 300
- name: wait for the guest to be drawing again after reset 1
  loop:
    max: 40
    do:
    - wait: 10
    ocr:
      name: back1
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: anything1
      from: back1
      mode: matches
      pattern: .
    until:
      fact: anything1
- name: the copy runs, look 2 of at most 8
  loop:
    max: 9
    do:
    - wait: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words: *id001
    until:
      fact: done
- name: reset the guest after look 2, because this installer stalls and a reset is what moves it
  reboot: true
