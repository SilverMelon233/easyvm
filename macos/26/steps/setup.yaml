    name: final
    region:
    - 0
    - 0
    - 1920
    - 1080
    region_at:
    - 1920
    - 1080
    scale: 1
    wait: 0
- name: the Setup Assistant is up
  check:
    name: assistant
    from: final
    mode: says_any
    words:
    - - select
      - your
      - country
      - or
      - region
    - - how
      - do
      - you
      - want
      - to
      - connect
      - to
      - the
