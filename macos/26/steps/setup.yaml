name: macos 26 setup (recovery image to setup assistant)
resolution:
- 1920
- 1080
vars:
  out:
    from: args.out
    default: out/macos26.qcow2
  disk_name:
    default: main
  expected_gb:
    default: '68'
  shutdown:
    from: args.shutdown
    default: kill
steps:
- name: the media this stage boots from is already on disk
  require:
  - recovery.dmg
  - boot.img
  - macos.rom
  - macos.vars
- name: start recording
  record: macos26-setup.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the recovery image
  boot: true
  os: macos
  recovery: recovery.dmg
  # TWELVE GIBABYTES, AND THE NUMBER IS SET BY THE CI RUNNER RATHER THAN BY THE GUEST.
  #
  # 16384 WAS THE VALUE UNTIL IT WAS MEASURED AGAINST THE RUNNER. GitHub's standard `ubuntu-24.04`
  # reports `MemTotal` of 15 GiB, and qemu allocates a guest's RAM on demand, so a 16 GiB guest boots,
  # looks healthy for three minutes, and is then killed once the copy touches enough pages:
  #
  #	run 44122437321   erase, licence and destination all passed; at look 1 attempt 10 the QMP
  #	                  connection became `write: broken pipe` and stayed that way, the daemon logged
  #	                  no error, the console had nothing after HANDOFF TO XNU, and disk.qcow2 was
  #	                  still 194 KiB - it had never grown at all
  #
  # MEASURED ON A HOST WITH ROOM: qemu's RSS during the copy climbs to 12.01 GiB for a 12 GiB guest
  # and plateaus there - the guest uses essentially all of what it is given - while the disk grew
  # 14.35 -> 16.81 -> 28.42 -> 29.63 -> 35.26 -> 37.85 GiB and the pane counted down "About 55
  # minutes remaining" to "About 22". So 12 GiB boots, erases, and installs, and it is the largest
  # request that leaves the runner room for qemu itself and the page cache.
  #
  # AND THE SAME RUN REACHED THE INSTALLER'S OWN FINAL RESTART, WHICH IS WHAT THE BLACK SCREEN WAS.
  #
  # An earlier version of this comment called that a stall and was WRONG. The evidence is a frame the
  # recorder kept, at 18:51:56 - the Apple logo, a progress bar about four fifths full, and the words
  # "About 21 minutes remaining...". The disk stopped growing at 37.95 GiB because the copy had
  # finished and the guest was waiting to restart. So the sequence at 12288 was
  #
  #	erase -> licence -> copy (37.95 GiB) -> installer restart -> progress bar, 21 minutes left
  #
  # BUT THAT RUN WAS STOPPED BY HAND WHILE THE PROGRESS BAR STILL READ 21 MINUTES, SO IT PROVES LESS
  # THAN IT LOOKS. Booting the 37.95 GiB disk it left behind reaches the Apple logo and a progress bar
  # that never advances - the disk is an UNFINISHED INSTALL, which is what stopping during the final
  # restart produces. So this run shows 12 GiB erases, copies and reaches the installer's restart; it
  # does not show 12 GiB reaching the Setup Assistant, because nothing waited for it.
  #
  # THE CI RUN AT THIS SIZE IS THE TEST OF THAT LAST STEP, and it is the only one that is.
  memory_mb: 12288
  timeout: 900
- name: the recovery menu's rows
  ocr:
    name: recovery
    region:
    - 760
    - 200
    - 1400
    - 560
    region_at:
    - 1920
    - 1080
    scale: 6
    wait: 5
- name: wait for the recovery menu
  loop:
    max: 180
    do:
    - wait: 10
    ocr:
      name: recovery
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 6
      wait: 0
    check:
      name: done
      from: recovery
      mode: says_any
      words:
      - - restore
        - time
        - machine
      - - reinstall
        - macos
      - - safari
      - - disk
        - utility
    until:
      fact: done
- name: select disk utility
  click:
  - 800
  - 523
  wait_after: 3
- name: open disk utility
  click:
  - 1148
  - 595
  wait_after: 8
- name: make disk utility full screen
  at_color:
  - 40
  - 200
  - 64
  color_tolerance: 45
  color_region:
  - 0
  - 30
  - 700
  - 400
  wait_after: 6
- name: select the first disk
  click:
  - 200
  - 132
  wait_after: 2
- name: is the selected disk the uninitialised one
  ocr:
    name: details
    region:
    - 360
    - 105
    - 1100
    - 200
    region_at:
    - 1920
    - 1080
    scale: 4
    wait: 0
- name: the first disk is the uninitialised one
  check:
    name: uninitialised
    from: details
    mode: contains
    text: Uninitialized
- name: select the second disk, when row 1 was the boot image
  if: uninitialised
  else:
  - name: click row 2
    click:
    - 200
    - 164
    wait_after: 2
  - name: is the second disk the uninitialised one
    ocr:
      name: details
      region:
      - 360
      - 105
      - 1100
      - 200
      region_at:
      - 1920
      - 1080
      scale: 4
      wait: 0
  - name: the second disk is the uninitialised one
    check:
      name: uninitialised
      from: details
      mode: contains
      text: Uninitialized
- name: erase - open the sheet
  loop:
    max: 6
    do:
    - click:
      - 1711
      - 56
    - wait: 3
    ocr:
      name: sheet
      region:
      - 720
      - 425
      - 1200
      - 680
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: sheet_up
      from: sheet
      mode: says_any
      words:
      - - erase
        - deleted
      - - free
        - space
      - - security
        - option
      - - cancel
        - erase
    until:
      fact: sheet_up
  wait_after: 4
- name: erase - clear the name field
  key: meta_l+a
  wait_after: 1
- name: erase - name the volume
  click:
  - 988
  - 542
  type: '{{ disk_name }}'
  wait_after: 4
- name: erase - confirm
  click:
  - 1154
  - 650
  wait_after: 5
- name: erase - wait for the report
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - erase
        - complete
      - - erase
        - process
    until:
      fact: done
- name: erase - done
  click:
  - 1147
  - 614
  wait_after: 5
- name: close disk utility
  key: meta_l+q
  wait_after: 12
- name: the recovery menu is back
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - reinstall
      - macos
    until:
      fact: done
- name: select reinstall macos
  click:
  - 837
  - 333
  wait_after: 3
- name: open the installer
  click:
  - 1142
  - 586
  wait_after: 20
- name: wait for the installer to load
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: instaload
      region:
      - 400
      - 560
      - 1520
      - 700
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: loaded
      from: instaload
      mode: says_any
      words:
      - - agree
        - to
        - the
        - terms
      - - english
        - apple
      - - select
        - the
        - disk
      - - macos
    until:
      fact: loaded
- name: welcome continue
  click:
  - 960
  - 712
  wait_after: 5
- name: wait for the licence pane
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: licence
      region:
      - 660
      - 430
      - 1260
      - 700
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: licence_up
      from: licence
      mode: says_any
      words:
      - - software
        - license
        - agreement
      - - please
        - read
        - this
    until:
      fact: licence_up
- name: agree to the licence
  click:
  - 1005
  - 713
  wait_after: 5
- name: wait for the licence sheet
  loop:
    max: 12
    do:
    - wait: 5
    ocr:
      name: sheet
      region:
      - 780
      - 330
      - 1140
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: sheet_up
      from: sheet
      mode: says_any
      words:
      - - read
        - and
        - agree
      - - disagree
        - agree
    until:
      fact: sheet_up
- name: agree in the sheet
  click:
  - 1018
  - 520
  wait_after: 10
- name: select the destination card
  click:
  - 850
  - 550
  wait_after: 5
- name: destination continue
  click:
  - 1005
  - 712
  wait_after: 10
# THE POINTER IS MOVED OFF THE BUTTON IT JUST PRESSED, AND THAT IS THE REAL FIX.
#
# (1005,712) IS "Continue" ON THE PANE THAT ASKS WHERE TO INSTALL, AND IT IS "Cancel" ON THE PROGRESS
# VIEW THAT REPLACES IT - the same pixels, one pane later. Leaving the pointer there is what put up
#
#	Are you sure you want to cancel the installation of macOS Tahoe?
#	[Continue Installing]  [Quit]
#
# on run 44150638949, and that sheet then sat unanswered for the remaining 2.3 hours of the run while
# the copy - 40% at t+300s, 85% at t+600s - was already healthy underneath it.
#
# SO THE POINTER GOES SOMEWHERE WITH NO CONTROL ON IT before the long wait. MEASURED FROM THE FAILING
# RUN'S OWN FRAME: (960,330) is inside the macOS Tahoe artwork at the top of the progress view, a flat
# region whose pixels span rgb 65..91 - not a button, not a checkbox, not a text field. A click there
# does nothing, and that is the point.
#
# THE CANCEL SHEET IS ALSO ANSWERED IF IT APPEARS ANYWAY (see the branch inside look 1), because a
# pointer move is a mitigation and the sheet is what actually has to be handled.
- name: move the pointer off the cancel button
  click:
  - 960
  - 330
  wait_after: 2
- name: the copy runs, look 1 of at most 8
  loop:
    max: 270
    do:
    - wait: 20
    # THE COPY'S OWN CANCEL BUTTON SITS WHERE THE PREVIOUS STEP CLICKED, AND THE INSTALLER ASKS
    # "Are you sure you want to cancel" WHEN IT IS HIT.
    #
    # MEASURED ON RUN 44150638949, which is what this branch exists for: \`destination continue\`
    # clicks (1005,712) on the pane that says "macOS Tahoe will be installed on the disk", the copy
    # starts and the pane BECOMES the progress view - and on that view (1005,712) is the CANCEL
    # button. The pointer was still there, Cancel fired, and the installer put up
    #
    #	Are you sure you want to cancel the installation of macOS Tahoe?
    #	"Reinstall macOS" in the menu and "Continue" again.
    #	[Continue Installing]  [Quit]
    #
    # The frames prove the copy itself was healthy: 40% at t+300s, 85% at t+600s, "About 12 minutes
    # remaining" - and then the dialog, unchanged for the remaining 2.3 hours of the run.
    #
    # CONTINUE INSTALLING IS (960,508), measured from that frame. Answering it is the whole fix: the
    # copy resumes where it stopped rather than starting over.
    - name: read the pane for the cancel sheet
      ocr:
        name: cancelshot
        region:
        - 820
        - 300
        - 1100
        - 600
        region_at:
        - 1920
        - 1080
        scale: 1
        wait: 0
    - name: classify - the cancel confirmation
      check:
        name: cancel_sheet
        from: cancelshot
        mode: says
        words:
        - continue
        - installing
    - name: answer the cancel confirmation
      if: cancel_sheet
      then:
        - name: continue installing
          click:
          - 960
          - 508
          wait_after: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    # THE TEST IS "THE SETUP ASSISTANT, OR A BLACK SCREEN".
    #
    # MEASURED ON RUN 44190274785: with the cancel sheet answered the install ran to its end - reads
    # 63..65 said "About 17 / 16 minutes remaining" - and every read from attempt 66 to attempt 270
    # said `0 word(s)`. The video agrees: t=1700s is the installer's own Apple-logo restart, and
    # every frame after it is identical black. `broken pipe` was 0, so the machine was alive and
    # simply never drew again; this loop then spent its whole ceiling waiting for words that were
    # never coming, and the run failed on a disk that was already written.
    #
    # `says_any` CANNOT SAY "OR NOTHING WAS DRAWN" - it needs a word list and an empty reading
    # matches none of them. `matches` runs a regex over the normalised reading, so the pattern's
    # first alternative expresses a black frame.
    #
    # IT IS `^.{0,3}$` AND NOT `^$`, MEASURED BOTH WAYS. Run 44190274785's black frames read
    # `0 word(s)`, which `^$` would catch. But a black frame on this host reads `e` - one stray
    # character OCR keeps from the noise - and `^$` misses it, so the loop would wait out its whole
    # ceiling on a screen that is plainly black. `^.{0,3}$` covers "", "e" and a two-token "a b"
    # (the reading is the words joined by spaces) while still rejecting "about 17 minutes remaining",
    # "update mac automatically" and "select your country or region" - all six measured.
    #
    # WHAT HAPPENS NEXT IS THE STEP THAT ALREADY FOLLOWS THIS LOOP - `reset the guest after look 1`,
    # which was written for the installer's stall. MEASURED LOCALLY ON A COPY OF THIS RUN'S OWN
    # UNFINISHED DISK AT 12 GiB: boot, 120 s of black (the reading is "e"), `reboot: true`, and the
    # pane reads "Select Your Country or Region". Control: a COMPLETED disk (FINAL.qcow2, 38.40 GiB)
    # boots straight to the Setup Assistant at 12288 with no reset - so the reset is not covering a
    # broken install, it is what makes a finished one draw.
    check:
      name: done
      from: screen
      mode: matches
      pattern: '^.{0,3}$|select your country or region|transfer your information to this mac|choose a wireless network|sign in with your apple id|update mac automatically|choose your look'
    until:
      fact: done
- name: reset the guest after look 1, because this installer stalls and a reset is what moves it
  reboot: true
  timeout: 300
- name: wait for the guest to be drawing again after reset 1
  loop:
    max: 40
    do:
    - wait: 10
    ocr:
      name: back1
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: anything1
      from: back1
      mode: matches
      pattern: .
    until:
      fact: anything1
- name: the copy runs, look 2 of at most 8
  loop:
    max: 9
    do:
    - wait: 20
    ocr:
